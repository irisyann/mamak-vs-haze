<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta

    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link

      href="https://fonts.googleapis.com/css2?family=Anton&family=Courier+Prime:wght@400;700&family=Figtree:wght@400;600;800&display=swap"
    />
    <style>
      /* Layout: full-bleed canvas night scene at a mamak stall; HUD on the zinc roof, arm/e-fan dock at the bottom, cards float centre. Deliberately single-theme (night). */
      :root {
        --night: #171c1e;
        --panel: #222a2c;
        --line: #3a4447;
        --tube: #eaf6e8;
        --stool: #d63a2c;
        --teh: #d9a066;
        --haze: #c4b692;
        --fire: #f08a3c;
        --volt: #5fb8ff;
        --ink: #f3eee3;
        --muted: #a6ab9f;
        --display: "Anton", "Impact", "Arial Narrow", sans-serif;
        --mono: "Courier Prime", "Courier New", monospace;
        --paper: #f6f1e4;
        --paperInk: #2b2620;
        --lam: #fff3cc;
        --lamInk: #2a1f14;
        --red: #c22d24;
        --yel: #f6d35b;
        --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      body {
        background: var(--night);
        color: var(--ink);
        font-family: var(--body);
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #cv {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        display: block;
        cursor: grab;
      }
      .hud {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
        padding-bottom: 8px;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        pointer-events: none;
      }
      .chip {
        background: rgba(23, 28, 30, 0.84);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .api {
        display: flex;
        flex-direction: column;
        padding: 5px 9px;
        min-width: 0;
      }
      .api-row {
        display: flex;
        align-items: baseline;
        gap: 5px;
      }
      .api-k {
        font-size: 10px;
        letter-spacing: 0.12em;
        color: var(--muted);
        font-weight: 800;
      }
      .api b {
        font-family: var(--display);
        font-weight: 400;
        font-size: 19px;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      .api #apiL {
        font-size: 10px;
        font-weight: 600;
        white-space: nowrap;
      }
      .till {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 5px 10px;
      }
      .till b {
        font-family: var(--display);
        font-weight: 400;
        font-size: 18px;
        color: var(--teh);
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
      }
      .till span {
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 0.06em;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .stools {
        display: flex;
        gap: 2px;
        padding: 6px 7px;
      }
      .stools svg {
        width: 14px;
        height: 17px;
        transition:
          transform 0.3s,
          opacity 0.3s;
      }
      .stools svg.gone {
        opacity: 0.28;
        transform: rotate(80deg) translateY(3px);
      }
      .banner {
        position: fixed;
        left: 50%;
        transform: translate(-50%, -50%);
        top: 50%;
        z-index: 6;
        width: min(360px, calc(100% - 32px));
        background: rgba(60, 28, 12, 0.9);
        border: 1px solid var(--fire);
        border-radius: 12px;
        padding: 12px 16px;
        text-align: center;
        pointer-events: none;
      }
      .banner b {
        display: block;
        font-family: var(--display);
        font-weight: 400;
        font-size: 17px;
        color: var(--fire);
        letter-spacing: 0.02em;
      }
      .banner span {
        font-size: 13px;
        color: var(--ink);
      }
      .banner.fire {
        animation: flash 0.45s steps(2, jump-none) infinite;
      }
      @keyframes flash {
        50% {
          background: rgba(170, 52, 14, 0.95);
          border-color: #ffd27a;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .banner.fire {
          animation: none;
        }
      }
      .banner.info {
        background: rgba(23, 28, 30, 0.9);
        border-color: var(--line);
      }
      .banner.info b {
        color: var(--teh);
      }
      .dock {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 5;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 8px;
        padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
        padding-top: 8px;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        pointer-events: none;
      }
      .arm {
        flex: 1;
        max-width: 240px;
        padding: 7px 10px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .arm .lbl {
        display: flex;
        justify-content: space-between;
        gap: 6px;
        font-size: 10px;
        letter-spacing: 0.12em;
        font-weight: 800;
        color: var(--muted);
      }
      .arm .lbl em {
        font-style: normal;
        color: var(--ink);
      }
      .bar {
        height: 9px;
        border-radius: 5px;
        background: #11161a;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 100%;
        border-radius: 5px;
        background: var(--teh);
        transition: background 0.2s;
      }
      .arm.tired .bar i {
        background: var(--stool);
      }
      .arm.tired .bar {
        animation: flashred 0.35s steps(2, jump-none) infinite;
      }
      .arm.tired {
        border-color: var(--stool);
      }
      @keyframes flashred {
        50% {
          background: #8a2018;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .arm.tired .bar {
          animation: none;
        }
      }
      .snd {
        pointer-events: auto;
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        padding: 0;
        display: grid;
        place-items: center;
        cursor: pointer;
        color: var(--ink);
      }
      .snd svg {
        width: 20px;
        height: 20px;
      }
      .snd[aria-pressed="false"] {
        color: var(--muted);
      }
      .snd[aria-pressed="false"] .wave {
        display: none;
      }
      .snd:not([aria-pressed="false"]) .x {
        display: none;
      }
      .tray {
        pointer-events: auto;
        touch-action: none;
        flex: none;
        height: 56px;
        min-width: 50px;
        padding: 4px 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        cursor: grab;
        color: var(--ink);
        font: inherit;
      }
      .tray svg {
        width: 30px;
        height: 20px;
      }
      .tray b {
        font-family: var(--display);
        font-weight: 400;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      .tray.armed {
        border-color: #bfe3f2;
        box-shadow: 0 0 0 2px #bfe3f2;
      }
      .tray:disabled {
        opacity: 0.4;
      }
      .tools {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        flex: none;
      }
      @media (max-width: 600px) {
        .tools {
          display: grid;
          grid-template-rows: repeat(2, auto);
          grid-auto-flow: column;
          gap: 6px;
        }
        .tray {
          flex-direction: row;
          height: 30px;
          min-width: 0;
          padding: 0 8px;
          gap: 5px;
          justify-content: flex-start;
        }
        .tray svg {
          width: 22px;
          height: 15px;
        }
        .tray b {
          font-size: 11px;
        }
        .efan {
          width: 58px;
          height: 58px;
        }
      }
      .arm.tired .lbl em {
        color: var(--stool);
      }
      .arm.powered .bar i {
        background: var(--volt);
      }
      .efan.charging::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          transparent 0 78%,
          rgba(255, 255, 255, 0.6) 92%,
          transparent
        );
        animation: spin 1.1s linear infinite;
        z-index: 1;
        pointer-events: none;
      }
      .efan .bolt {
        position: absolute;
        z-index: 3;
        left: 50%;
        top: -14px;
        width: 16px;
        height: 22px;
        margin-left: -8px;
        display: none;
        background: var(--volt);
        clip-path: polygon(60% 0, 10% 55%, 45% 55%, 35% 100%, 90% 40%, 55% 40%);
        animation: pulse 0.8s ease-in-out infinite;
      }
      .efan.charging .bolt {
        display: block;
      }
      .efan.charging span {
        color: var(--volt);
        z-index: 2;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.85);
        }
        50% {
          opacity: 1;
          transform: scale(1.1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .efan.charging::before,
        .efan .bolt {
          animation: none;
        }
      }
      .efan {
        pointer-events: none;
        position: relative;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        padding: 0;
        flex: none;
        background: conic-gradient(var(--volt) calc(var(--b, 1) * 360deg), #2c3538 0);
        box-shadow: 0 4px 0 #0c1012;
        border: 0;
        cursor: pointer;
      }
      .efan span {
        z-index: 2;
        position: absolute;
        inset: 5px;
        border-radius: 50%;
        background: var(--panel);
        display: grid;
        place-items: center;
        font-family: var(--display);
        font-size: 11px;
        color: var(--ink);
        line-height: 1.05;
        text-align: center;
      }
      .efan[aria-pressed="true"] span {
        background: #123247;
        color: var(--volt);
      }
      .efan.low span {
        color: var(--muted);
      }
      .efan:focus-visible {
        outline: 3px solid var(--tube);
        outline-offset: 3px;
      }
      .ov {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        overflow-y: auto;
        background: rgba(15, 18, 19, 0.6);
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        padding-block: calc(env(safe-area-inset-top, 0px) + 20px)
          calc(env(safe-area-inset-bottom, 0px) + 20px);
      }
      .card {
        margin: auto;
        width: min(400px, 100%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 22px 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        max-height: 100%;
        overflow-y: auto;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 800;
      }
      h1 {
        font-family: var(--display);
        font-weight: 400;
        font-size: 32px;
        line-height: 1;
        margin: 0;
        color: var(--teh);
        text-wrap: balance;
      }
      h1 span {
        display: block;
        color: var(--haze);
        font-size: 0.62em;
        margin-top: 4px;
      }
      h2 {
        font-family: var(--display);
        font-weight: 400;
        font-size: 15px;
        margin: 0;
        color: var(--ink);
        letter-spacing: 0.02em;
      }
      .card p {
        margin: 0;
        line-height: 1.5;
        font-size: 15px;
      }
      .how {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .how li {
        display: flex;
        gap: 10px;
        font-size: 14px;
        line-height: 1.4;
        color: var(--muted);
      }
      .how li b {
        color: var(--ink);
        font-weight: 600;
      }
      .dot {
        flex: none;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-top: 5px;
      }
      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .stat {
        background: var(--night);
        border-radius: 10px;
        padding: 9px 12px;
      }
      .stat small {
        display: block;
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 800;
      }
      .stat b {
        font-family: var(--display);
        font-weight: 400;
        font-size: 20px;
        font-variant-numeric: tabular-nums;
      }
      .stat b.neg {
        color: var(--stool);
      }
      .wallet {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }
      .wallet b {
        font-family: var(--display);
        font-weight: 400;
        font-size: 24px;
        color: var(--teh);
        font-variant-numeric: tabular-nums;
      }
      .shop {
        display: grid;
        gap: 8px;
        max-height: min(260px, 38vh);
        overflow-y: auto;
        overscroll-behavior: contain;
        padding-right: 2px;
        margin-right: -2px;
      }
      .item {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
        background: var(--night);
        border-radius: 12px;
        padding: 10px 12px;
      }
      .item > div {
        min-width: 0;
      }
      .item h3 {
        margin: 0;
        font-size: 14px;
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .pips {
        display: inline-flex;
        gap: 3px;
      }
      .card p.quit {
        font-size: 14px;
        color: #ff8a7c;
        background: rgba(214, 58, 44, 0.12);
        border: 1px solid rgba(214, 58, 44, 0.4);
        border-radius: 10px;
        padding: 9px 12px;
      }
      .place {
        grid-column: 1/-1;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
      }
      .place button {
        font: inherit;
        font-weight: 800;
        min-width: 34px;
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
      }
      .place button.warn {
        border-color: var(--stool);
        color: #ff8a7c;
      }
      .place button:disabled:not([aria-pressed="true"]) {
        opacity: 0.45;
        cursor: default;
      }
      .place button[aria-pressed="true"] {
        cursor: default;
        background: var(--volt);
        color: #0c2233;
        border-color: var(--volt);
      }
      .new {
        font-size: 9px;
        letter-spacing: 0.1em;
        background: var(--fire);
        color: #2a1206;
        border-radius: 4px;
        padding: 2px 5px;
        font-weight: 800;
      }
      .pips i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #3a4447;
      }
      .pips i.on {
        background: var(--teh);
      }
      .item p {
        font-size: 12.5px;
        line-height: 1.4;
        color: var(--muted);
        margin-top: 3px;
      }
      .buy {
        font-family: var(--display);
        font-size: 13px;
        padding: 9px 11px;
        border-radius: 10px;
        border: 0;
        background: var(--teh);
        color: #2a1a0c;
        cursor: pointer;
        box-shadow: 0 3px 0 #8a5a2c;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .buy:disabled {
        background: #3a4447;
        color: var(--muted);
        box-shadow: none;
        cursor: default;
      }
      .forecast {
        font-size: 13px;
        line-height: 1.45;
        color: var(--muted);
        background: var(--night);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .forecast b {
        color: var(--fire);
        font-weight: 800;
      }
      .go {
        font-family: var(--display);
        font-size: 18px;
        color: #fff;
        background: var(--stool);
        border: 0;
        border-radius: 12px;
        padding: 14px 18px;
        cursor: pointer;
        box-shadow: 0 4px 0 #8f2219;
      }
      .go:active,
      .buy:active {
        transform: translateY(3px);
        box-shadow: none;
      }
      button:focus-visible {
        outline: 3px solid var(--tube);
        outline-offset: 3px;
      }
      .best {
        font-size: 13px;
        color: var(--muted);
        text-align: center;
      }
      #shopOv .card {
        gap: 10px;
        padding-block: 16px;
      }
      #shopOv h1 {
        font-size: 22px;
      }
      #shopOv .stats {
        grid-template-columns: repeat(4, 1fr);
        gap: 5px;
      }
      #shopOv .stat {
        padding: 5px 6px;
        text-align: center;
      }
      #shopOv .stat small {
        font-size: 8.5px;
        letter-spacing: 0.06em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #shopOv .stat b {
        font-size: 14px;
      }
      #shopOv .wallet {
        padding-top: 8px;
      }
      #shopOv .wallet b {
        font-size: 22px;
      }
      #shopOv .shop {
        position: relative;
        max-height: min(380px, 52vh);
      }
      #shopOv .new {
        animation: blink 1.6s ease-in-out infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.55;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #shopOv .new {
          animation: none;
        }
      }
      .tm {
        position: fixed;
        z-index: 30;
        left: max(10px, env(safe-area-inset-left, 0px));
        top: calc(env(safe-area-inset-top, 0px) + 70px);
        font-family: var(--body);
        font-size: 12px;
        max-width: calc(100% - 20px);
      }
      .tm-tab {
        font-family: var(--display);
        font-size: 11px;
        background: #7b2cbf;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 5px 9px;
        cursor: pointer;
      }
      .tm-body {
        margin-top: 6px;
        background: rgba(18, 14, 28, 0.94);
        border: 1px solid #7b2cbf;
        border-radius: 12px;
        padding: 10px;
        display: grid;
        gap: 7px;
        width: 270px;
        max-width: 100%;
      }
      .tm-row {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        align-items: center;
      }
      .tm-row label,
      .tm-row span {
        color: var(--muted);
        font-weight: 800;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-right: 2px;
      }
      .tm-row input {
        width: 56px;
        font: inherit;
        font-weight: 800;
        padding: 5px 6px;
        border-radius: 7px;
        border: 1px solid var(--line);
        background: var(--night);
        color: var(--ink);
      }
      .tm-row button {
        font: inherit;
        font-weight: 700;
        padding: 6px 8px;

              <span data-i="rcTotal"></span><span id="shRm">RM0</span>
            </div>
            <div class="rc-row"><span id="rcWalkL"></span><span id="shWalk">0</span></div>
            <p class="quit" id="shQuit" hidden></p>

        </div>
        <div class="tin"><span data-i="tin"></span><b id="shWallet">RM0</b></div>
        <div class="menu">
          <div class="menu-h" data-i="shopH"></div>
          <div class="shop" id="shop"></div>

    <div class="ov" id="smokeOv" hidden>
      <div class="card">
        <div class="eyebrow" data-i="smEye"></div>
        <h1 data-i="smT"></h1>
        <p data-i="smP"></p>
        <button class="go" id="smokeOk" data-i="ok"></button>

    <div class="ov" id="over" hidden>
      <div class="card">
        <div class="eyebrow" data-i="overEye"></div>
        <div class="rc-wrap">
          <div class="receipt">
            <div class="rc-head" data-i="stallName"></div>
            <div class="rc-sub" data-i="rcFinal"></div>
            <div class="rc-sep"></div>
            <div class="rc-row"><span data-i="nights"></span><span id="sNights">0</span></div>
            <div class="rc-row"><span data-i="orders"></span><span id="sSold">0</span></div>
            <div class="rc-row"><span data-i="peak"></span><span id="sApi">0</span></div>
            <div class="rc-sep"></div>
            <div class="rc-row rc-total"><span data-i="total"></span><span id="sRm">RM0</span></div>
            <div class="stamp big" id="overT"></div>
          </div>
        </div>
        <button class="go" id="again" data-i="again"></button>
        <button class="go alt" id="copyRes" data-i="copyBtn"></button>
        <textarea id="shareTxt" readonly rows="4" hidden data-ia="ariaShare"></textarea>
        <div class="best" id="best2"></div>
      </div>
    </div>

    <script>
      (async () => {
        const $ = (id) => document.getElementById(id);
        const cv = $("cv"),
          ctx = cv.getContext("2d");
        const bg = document.createElement("canvas"),
          bx = bg.getContext("2d");
        let NIGHT = 30;
        const TS = 90 / 30,
          MAXW = 5,
          TH = 1.1,
          PRICE = 2,
          ROTI = 3,
          WAGE = 30;
        // SHOP: from = first night after which the item shows; sign's from is set when the first smoker appears; purif prices escalate per unit owned
        const SHOP = await (await fetch("shop.json")).json();
        const STAFF_NAMES = ["Raju", "Ah Seng"],
          SIGNCD = 8;
        let lang = "en";
        try {
          lang = localStorage.getItem("ttj-lang") || "en";
        } catch (e) {}
        const LANG_FILES = { en: "lang/en.json", ms: "lang/bm.json" };
        const L = Object.fromEntries(
          await Promise.all(
            Object.entries(LANG_FILES).map(async ([l, f]) => [l, await (await fetch(f)).json()]),
          ),
        );
        const T = (k) => L[lang][k];
        // F: fill {placeholders}; {one,other} entries pick by v.n
        const F = (k, v) => {
          let s = T(k);
          if (s && typeof s === "object") s = v.n === 1 ? s.one : s.other;
          return s.replace(/\{(\w+)\}/g, (_, x) => v[x]);
        };
        let W, H, DPR, S, topH, roofH;
        const tables = [0, 1, 2, 3].map((i) => ({ x: 0, y: 0, cust: null, respawn: 0, dens: 0 }));
        let state = "menu",
          clock = 0,
          nightT = 0,
          spawnAcc = 0,
          waveT = 14,
          parts = [],
          floats = [],
          trails = [],
          staff = [];
        let tehN = 0,
          rotiN = 0,
          billNo = 40,
          night = 1,
          wallet = 0,
          tonight = 0,
          soldNight = 0,
          soldTotal = 0,
          earnedTotal = 0,
          walk = 0,
          api = 20,
          peak = 20;
        let up = { grip: 0, efan: 0, batt: 0, staff: 0, sign: 0, purif: 0, roti: 0, tv: 0, cat: 0, blower: 0 },
          purifs = [false, false, false, false],
          filt = [2, 2, 2, 2];
        let smokerNight = 0,
          cat = null,
          signHint = false,
          masks = 0,
          everMask = false,
          armed = null,
          signCd = 0,
          sum = null,
          drag = null,
          lastCough = 0,
          lastWhoosh = 0,
          seenSmoker = false,
          stam = 100,
          tired = false,
          lastSwipe = 0,
          batt = 100,
          efanOn = false,
          fireT = 0,
          fires = [],
          blackT = 0,
          blackDur = 0,
          blackouts = [],
          bannerT = 0;
        const pointers = new Map();
        let best = 0;
        try {
          best = +localStorage.getItem("ttj-best-nights") || 0;
        } catch (e) {}
        // --- sound (synthesised, no files)
        let AC = null,
          noiseBuf = null,
          soundOn = true;
        try {
          soundOn = localStorage.getItem("ttj-sound") !== "0";
        } catch (e) {}
        function ac() {
          if (!AC) {
            try {
              AC = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
              return null;
            }
          }
          if (AC.state === "suspended") AC.resume();
          return AC;
        }
        function tone(f, dur, type, vol, to, delay) {
          if (!soundOn) return;
          const a = ac();
          if (!a) return;
          const t = a.currentTime + (delay || 0),
            o = a.createOscillator(),
            g = a.createGain();
          o.type = type || "sine";
          o.frequency.setValueAtTime(f, t);
          if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          o.connect(g).connect(a.destination);
          o.start(t);
          o.stop(t + dur + 0.03);
        }
        function noise(dur, freq, q, vol, type, delay, to) {
          if (!soundOn) return;
          const a = ac();
          if (!a) return;
          if (!noiseBuf) {
            noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate);
            const d = noiseBuf.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
          }
          const t = a.currentTime + (delay || 0),
            src = a.createBufferSource(),
            f = a.createBiquadFilter(),
            g = a.createGain();
          src.buffer = noiseBuf;
          f.type = type || "bandpass";
          f.frequency.setValueAtTime(freq, t);
          if (to) f.frequency.exponentialRampToValueAtTime(to, t + dur);
          f.Q.value = q || 1;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.03, dur / 3));
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          src.connect(f).connect(g).connect(a.destination);
          src.start(t, Math.random() * 0.5);
          src.stop(t + dur + 0.05);
        }
        const SFX = {
          whoosh(s, e) {
            noise(
              0.24,
              (e ? 1400 : 700) + s * 1300,
              0.8,
              0.1 + 0.12 * s,
              "bandpass",
              0,
              e ? 900 : 300,
            );
          },
          kaching() {
            tone(1318, 0.12, "triangle", 0.16);
            tone(1760, 0.28, "triangle", 0.14, null, 0.07);
          },
          cough() {
            noise(0.09, 650, 1.6, 0.22, "bandpass");
            noise(0.11, 520, 1.6, 0.18, "bandpass", 0.15);
          },
          walkout() {
            tone(330, 0.4, "sawtooth", 0.07, 130);
          },
          fire() {
            [0, 0.28, 0.56].forEach((d) => {
              tone(880, 0.14, "square", 0.05, null, d);
              tone(660, 0.14, "square", 0.05, null, d + 0.14);
            });
          },
          mask() {
            tone(520, 0.09, "sine", 0.2, 820);
            noise(0.06, 2400, 1, 0.06, "highpass");
          },
          ready() {
            tone(988, 0.1, "sine", 0.14);
            tone(1480, 0.2, "sine", 0.14, null, 0.09);
          },
          flat() {
            tone(620, 0.35, "sine", 0.14, 150);
          },
          tired() {
            tone(190, 0.3, "triangle", 0.18, 105);
          },
          lighter() {
            noise(0.05, 3200, 2, 0.14, "bandpass");
            noise(0.3, 900, 0.7, 0.05, "bandpass", 0.06);
          },
          night() {
            [523, 659, 784].forEach((f, i) => tone(f, 0.26, "triangle", 0.13, null, i * 0.12));
          },
          buy() {
            tone(784, 0.08, "triangle", 0.14);
            tone(1046, 0.16, "triangle", 0.14, null, 0.06);
          },
          stamp() {
            tone(240, 0.14, "square", 0.08, 110);
            noise(0.08, 1200, 1, 0.1, "bandpass");
          },
          clink() {
            tone(rnd(2600, 3300), 0.09, "triangle", 0.045);
            tone(rnd(4300, 5200), 0.06, "sine", 0.02, null, 0.012);
          },
          pour() {
            noise(0.5, 1900, 1.1, 0.06, "bandpass", 0, 600);
          },
          tick() {
            tone(1200, 0.05, "square", 0.05);
          },
        };
        let amb = null;
        const ambT = { m: 0, c: 2 };
        function ambStart() {
          if (!soundOn || amb) return;
          const a = ac();
          if (!a) return;
          if (!noiseBuf) {
            noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate);
            const d = noiseBuf.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
          }
          const src = a.createBufferSource();
          src.buffer = noiseBuf;
          src.loop = true;
          const f = a.createBiquadFilter();
          f.type = "bandpass";
          f.frequency.value = 520;
          f.Q.value = 0.6;
          const g = a.createGain();
          g.gain.setValueAtTime(0, a.currentTime);
          g.gain.linearRampToValueAtTime(0.045, a.currentTime + 1.2);
          const lfo = a.createOscillator();
          lfo.frequency.value = 0.21;
          const lg = a.createGain();
          lg.gain.value = 0.016;
          lfo.connect(lg).connect(g.gain);
          src.connect(f).connect(g).connect(a.destination);
          src.start();
          lfo.start();
          amb = { src, g, lfo, a };
        }
        function ambStop() {
          if (!amb) return;
          const { src, g, lfo, a } = amb;
          const t = a.currentTime;
          try {
            g.gain.cancelScheduledValues(t);
            g.gain.setValueAtTime(g.gain.value, t);
            g.gain.linearRampToValueAtTime(0, t + 0.5);
            src.stop(t + 0.6);
            lfo.stop(t + 0.6);
          } catch (e) {}
          amb = null;
        }
        function ambTick(dt) {
          if (!amb) return;
          ambT.m -= dt;
          ambT.c -= dt;
          if (ambT.m <= 0) {
            ambT.m = rnd(0.3, 1);
            noise(rnd(0.12, 0.3), rnd(280, 850), rnd(3, 6), 0.03, "bandpass");
          }
          if (ambT.c <= 0) {
            ambT.c = rnd(1.8, 4.5);
            SFX.clink();
          }
        }
        const sndBtn = $("snd");
        function updSnd() {
          sndBtn.setAttribute("aria-pressed", String(soundOn));
        }
        sndBtn.addEventListener("click", () => {
          soundOn = !soundOn;
          try {
            localStorage.setItem("ttj-sound", soundOn ? "1" : "0");
          } catch (e) {}
          updSnd();
          if (!soundOn) ambStop();
          else if (state === "play") ambStart();
          if (soundOn) SFX.tick();
        });
        updSnd();

        const stamMax = () => 100 + 30 * up.grip,
          regen = () => 24 * (1 + 0.4 * up.grip);
        const battIdle = () => 2.5,
          battSwipe = () => 0.045,
          battCharge = () => 9;

        function sprite(r, g, b, mid) {
          const c = document.createElement("canvas");
          c.width = c.height = 128;
          const p = c.getContext("2d");
          const gr = p.createRadialGradient(64, 64, 0, 64, 64, 64);
          gr.addColorStop(0, `rgba(${r},${g},${b},1)`);
          gr.addColorStop(0.45, `rgba(${r},${g},${b},${mid})`);
          gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
          p.fillStyle = gr;
          p.fillRect(0, 0, 128, 128);
          return c;
        }
        const SPR = {
          haze: sprite(200, 186, 150, 0.55),
          thick: sprite(150, 118, 80, 0.7),
          smoke: sprite(196, 204, 212, 0.5),
        };

        function rr(c, x, y, w, h, r) {
          c.beginPath();
          c.moveTo(x + r, y);
          c.arcTo(x + w, y, x + w, y + h, r);
          c.arcTo(x + w, y + h, x, y + h, r);
          c.arcTo(x, y + h, x, y, r);
          c.arcTo(x, y, x + w, y, r);
          c.closePath();
        }

        function resize() {
          DPR = Math.min(1.6, window.devicePixelRatio || 1);
          W = innerWidth;
          H = innerHeight;
          cv.width = W * DPR;
          cv.height = H * DPR;
          S = Math.max(0.8, Math.min(W, H) / 400);
          topH = Math.max(150, Math.min(H * 0.27, 230));
          roofH = Math.max(64, topH * 0.36);
          const wide = W / H > 1.15;
          const pos = wide
            ? [
                [0.2, 0.48],
                [0.4, 0.48],
                [0.6, 0.48],
                [0.8, 0.48],
              ]
            : [
                [0.27, 0.3],
                [0.73, 0.3],
                [0.27, 0.68],
                [0.73, 0.68],
              ];
          tables.forEach((t, i) => {
            t.x = W * pos[i][0];
            t.y = topH + (H - topH) * pos[i][1];
          });
          // centre the banner in the gap between table rows (below the row when wide)
          $("banner").style.top =
            (wide ? (tables[0].y + 40 * S + H - 80) / 2 : (tables[0].y + tables[2].y) / 2 - 20 * S) +
            "px";
          drawBG();
        }

        function drawBG() {
          bg.width = W * DPR;
          bg.height = H * DPR;
          const c = bx;
          c.setTransform(DPR, 0, 0, DPR, 0, 0);
          let g = c.createLinearGradient(0, topH, 0, H);
          g.addColorStop(0, "#30332e");
          g.addColorStop(1, "#141715");
          c.fillStyle = g;
          c.fillRect(0, 0, W, H);
          c.strokeStyle = "rgba(255,255,255,.04)";
          c.lineWidth = 1;
          const ts = 46 * S;
          for (let y = topH; y < H; y += ts) {
            c.beginPath();
            c.moveTo(0, y);
            c.lineTo(W, y);
            c.stroke();
          }
          for (let x = (W / 2) % ts; x < W; x += ts) {
            c.beginPath();
            c.moveTo(x, topH);
            c.lineTo(x, H);
            c.stroke();
          }
          g = c.createRadialGradient(W / 2, topH, 10, W / 2, topH, Math.max(W, H) * 0.75);
          g.addColorStop(0, "rgba(233,246,232,.17)");
          g.addColorStop(1, "rgba(233,246,232,0)");
          c.fillStyle = g;
          c.fillRect(0, topH, W, H - topH);
          c.fillStyle = "#8fb8a2";
          c.fillRect(0, roofH, W, topH - roofH);
          c.strokeStyle = "rgba(30,60,45,.18)";
          const wt = 16 * S;
          for (let y = roofH; y < topH; y += wt) {
            c.beginPath();
            c.moveTo(0, y);
            c.lineTo(W, y);
            c.stroke();
          }
          for (let x = 0; x < W; x += wt) {
            c.beginPath();
            c.moveTo(x, roofH);
            c.lineTo(x, topH);
            c.stroke();
          }
          c.fillStyle = "#5b625e";
          c.fillRect(0, 0, W, roofH);
          for (let x = 0; x < W; x += 14 * S) {
            c.fillStyle = "rgba(255,255,255,.07)";
            c.fillRect(x, 0, 5 * S, roofH);
          }
          g = c.createLinearGradient(0, roofH, 0, roofH + 12 * S);
          g.addColorStop(0, "rgba(0,0,0,.45)");
          g.addColorStop(1, "rgba(0,0,0,0)");
          c.fillStyle = g;
          c.fillRect(0, roofH, W, 12 * S);
          const sw = Math.min(W - 32, 340 * S),
            sh = Math.min(30 * S, (topH - roofH) * 0.3),
            sx = (W - sw) / 2,
            sy = roofH + 4 * S;
          c.fillStyle = "#c22d24";
          rr(c, sx, sy, sw, sh, 4 * S);
          c.fill();
          c.strokeStyle = "#f2c94c";
          c.lineWidth = 2 * S;
          rr(c, sx + 3 * S, sy + 3 * S, sw - 6 * S, sh - 6 * S, 3 * S);
          c.stroke();
          c.fillStyle = "#f6d35b";
          c.textAlign = "center";
          c.textBaseline = "middle";
          c.font = `${Math.round(sh * 0.44)}px Anton, Impact, sans-serif`;
          c.fillText(T("stallName"), W / 2, sy + sh / 2 + 1);
          const ty = sy + sh + 10 * S;
          for (const lx of [W * 0.18, W * 0.82]) {
            g = c.createRadialGradient(lx, ty, 2, lx, ty, 70 * S);
            g.addColorStop(0, "rgba(234,246,232,.5)");
            g.addColorStop(1, "rgba(234,246,232,0)");
            c.fillStyle = g;
            c.fillRect(lx - 90 * S, ty - 50 * S, 180 * S, 100 * S);
            c.fillStyle = "#f4fff2";
            rr(c, lx - 28 * S, ty - 2.5 * S, 56 * S, 5 * S, 2.5 * S);
            c.fill();
          }
          const ch = Math.max(18 * S, (topH - roofH) * 0.2),
            cy = topH - ch;
          g = c.createLinearGradient(0, cy, 0, topH);
          g.addColorStop(0, "#d7dcda");
          g.addColorStop(0.15, "#9ea6a4");
          g.addColorStop(1, "#6d7573");
          c.fillStyle = g;
          c.fillRect(0, cy, W, ch);
          c.fillStyle = "#2b3132";
          c.font = `700 ${Math.round(9 * S)}px Figtree, sans-serif`;
          c.fillText(
            F("boardTeh", { p: PRICE }) + (up.roti ? "      " + F("boardRoti", { p: ROTI }) : ""),
            W / 2,
            cy + ch * 0.55,
          );
          [
            [0.12, 1],
            [0.88, -1],
          ].forEach(([fx, dir]) => {
            const jx = W * fx,
              jy = cy;
            c.fillStyle = "#c9cfcd";
            c.beginPath();
            c.moveTo(jx - 9 * S, jy);
            c.lineTo(jx - 7 * S, jy - 22 * S);
            c.lineTo(jx + 7 * S, jy - 22 * S);
            c.lineTo(jx + 9 * S, jy);
            c.closePath();
            c.fill();
            c.strokeStyle = "#8d9592";
            c.lineWidth = 2 * S;
            c.beginPath();
            c.arc(jx + dir * 10 * S, jy - 12 * S, 6 * S, dir > 0 ? -1.6 : 1.6, dir > 0 ? 1.6 : 4.7);
            c.stroke();
          });
          c.fillStyle = "rgba(0,0,0,.35)";
          c.fillRect(0, topH, W, 4 * S);
        }

        const SHIRTS = [
          "#3d7bd9",
          "#e0a43a",
          "#5aa36b",
          "#c45ab3",
          "#e8e1d3",
          "#2f9fa8",
          "#e0664f",
        ];
        const SKINS = ["#8d5a3b", "#c68a5e", "#e6b48a", "#6b4128", "#d9a273", "#a8704a"];
        const SCARF = ["#6a4fa0", "#d9677f", "#3c8c86", "#e8c35a", "#2d4f7a"];
        const pick = (a) => a[(Math.random() * a.length) | 0];
        const rnd = (a, b) => a + Math.random() * (b - a);
        function smokerChance() {
          if (night < 7) return 0;
          return Math.min(0.45, 0.22 + 0.04 * (night - 7));
        }
        function newCust() {
          const smoker = state === "play" && Math.random() < smokerChance();
          if (smoker && !smokerNight) {
            smokerNight = night;
            SHOP.find((i) => i.id === "sign").from = night;
          }
          const h = Math.random(),
            hat = smoker
              ? h < 0.4
                ? "songkok"
                : "hair"
              : h < 0.18
                ? "songkok"
                : h < 0.38
                  ? "tudung"
                  : h < 0.58
                    ? "cgirl"
                    : h < 0.78
                      ? "igirl"
                      : "hair";
          return {
            shirt: smoker ? pick(["#5b5f63", "#7a5a3a", "#3b4a5a"]) : pick(SHIRTS),
            skin:
              hat === "cgirl"
                ? pick(["#f1c9a0", "#ecbf94"])
                : hat === "igirl"
                  ? pick(["#8d5a3b", "#a8704a", "#7a4a2e"])
                  : pick(SKINS),
            scarf: pick(SCARF),
            hat,
            pat: 1,
            ord: rnd(2, 3.2),
            ordMax: 3,
            item: "teh",
            state: "arrive",
            t: 0,
            coughT: 0.5,
            from: Math.random() < 0.5 ? -1 : 1,
            smoker,
            cig: 0,
            cigCd: rnd(1.5, 3.5),
            smokeAcc: 0,
            px: 0,
            py: 0,
            hy: 0,
          };
        }

        function addPart(side, kind) {
          kind = kind || "haze";
          if (parts.length > (kind === "smoke" ? 470 : 420)) return;
          if (side == null) {
            const r = Math.random();
            side = r < 0.4 ? 0 : r < 0.8 ? 1 : 2;
          }
          let x, y;
          if (side === 0) {
            x = -50 * S;
            y = topH * 0.6 + Math.random() * (H - topH * 0.6);
          } else if (side === 1) {
            x = W + 50 * S;
            y = topH * 0.6 + Math.random() * (H - topH * 0.6);
          } else {
            x = Math.random() * W;
            y = -40 * S;
          }
          let tx, ty;

            let rate = Math.min(28, 2.6 + (night - 1) * 1.3 + nightT * TS * (0.05 + 0.02 * night));
            for (const f of fires) {
              if (!f.done && nightT >= f.at && blackT <= 0) {
                f.done = true;
                fireT = f.dur;
                SFX.fire();
                banner(T("fire"), f.spots + " " + T("spots"), "fire", f.dur);
              }
            }
            if (fireT > 0) {
              fireT -= dt;
              rate *= 1.8;
              if (fireT <= 0) {
                fireT = 0;
                banner(T("wind"), T("easing"), "info", 2);
              }
            }
            for (const b of blackouts) {
              if (!b.done && nightT >= b.at && fireT <= 0) {
                b.done = true;
                blackT = blackDur = b.dur;
                SFX.flat();
                banner(T("blackout"), T("blackoutS"), "fire", b.dur);
              }
            }
            if (blackT > 0) {
              blackT -= dt;
              if (blackT <= 0) {
                blackT = 0;
                SFX.ready();
                banner(T("power"), T("powerS"), "info", 2);
              }
            }
            spawnAcc += rate * dt;
            while (spawnAcc >= 1) {
              spawnAcc--;
              const fire = fireT > 0;
              addPart(
                fire && Math.random() < 0.7 ? 0 : null,
                fire && Math.random() < 0.6 ? "thick" : "haze",
              );
            }
            waveT -= dt;
            if (waveT <= 0) {
              const side = (Math.random() * 3) | 0,
                n = 12 + night * 4 + Math.min(14, ((nightT * TS) / 6) | 0);
              for (let i = 0; i < n; i++) addPart(side);
              waveT = Math.max(3.5, (Math.max(7, 17 - night * 1.5) + Math.random() * 4) / TS);
            }
            if (!efanOn && clock - lastSwipe > 0.35) {
              stam = Math.min(stamMax(), stam + regen() * dt);
              if (tired && stam >= stamMax() * 0.35) tired = false;
            }
            if (up.efan && blackT > 0) {
              if (efanOn) setEfan(false);
            } else if (up.efan) {
              if (efanOn) {
                batt -= battIdle() * dt;
                if (batt <= 0) {
                  batt = 0;
                  setEfan(false);
                  SFX.flat();
                  float(W / 2, H * 0.55, T("dead"), "#5fb8ff", 15);
                }
              } else {
                batt = Math.min(100, batt + battCharge() * dt);
                if (batt >= 100) {
                  setEfan(true);
                  SFX.ready();
                }
              }
            }
            staffUpdate(dt);
            catUpdate(dt);
            if (signCd > 0) signCd = Math.max(0, signCd - dt);
            if (nightT >= NIGHT) {
              endNight();
            }
          }
          const k = Math.exp(-1.7 * dt),
            M = 140 * S,
            purs =
              state === "play" && blackT <= 0
                ? purifs.map((o, i) => (o && filt[i] > 0 ? purPos(i) : null)).filter(Boolean)
                : [],
            PR = 125 * S;
          for (let i = parts.length - 1; i >= 0; i--) {
            const p = parts[i];
            p.f = Math.min(1, p.f + dt * 0.7);
            p.ph += dt;
            p.age += dt;
            if (p.kind === "smoke") {
              p.r = Math.min(34 * S, p.r + dt * 4 * S);
            }
            p.x += (p.vx + p.px + Math.sin(p.ph * 0.7) * 6 * S) * dt;
            p.y += (p.vy + p.py + Math.cos(p.ph * 0.5) * 4 * S) * dt;
            p.px *= k;
            p.py *= k;
            if (p.blown) p.a -= 0.9 * dt;
            for (const q of purs) {
              const d = Math.hypot(p.x - q.x, p.y - (q.y - 10 * S));
              if (d < PR) {
                const f = 1 - d / PR;
                p.a -= 0.32 * dt * f;
                p.px += ((q.x - p.x) / (d || 1)) * 60 * S * f * dt;
                p.py += ((q.y - 10 * S - p.y) / (d || 1)) * 60 * S * f * dt;
              }
            }
            p.w = Math.max(0, p.a) * p.f * Math.min(1, (p.life - p.age) / 2);
            if (
              p.a < 0.03 ||
              p.age > p.life ||
              p.x < -M ||
              p.x > W + M ||
              p.y < -M ||
              p.y > H + M
            ) {
              parts[i] = parts[parts.length - 1];
              parts.pop();
            }
          }
          const R = 68 * S,
            R2 = R * R;
          tables.forEach((t) => (t.dens = 0));
          for (const p of parts) {
            for (const t of tables) {
              const dx = p.x - t.x,
                dy = p.y - (t.y - 14 * S),
                d2 = dx * dx + dy * dy;
              if (d2 < R2) t.dens += p.w * (p.kind === "smoke" ? 1.4 : 1) * (1 - Math.sqrt(d2) / R);
            }
          }
          let sum = 0;
          for (const t of tables) {
            sum += t.dens;
            if (!t.cust) {
              if (state === "play") {
                t.respawn -= dt;
                if (t.respawn <= 0) t.cust = newCust();
              }
              continue;
            }
            const c = t.cust;
            c.t += dt;
            custPos(c, t);
            if (c.state === "arrive") {
              if (c.t > 1.1) {
                c.state = "sit";
                c.t = 0;
              }
            } else if (c.state === "sit" && state === "play") {
              if (c.mask > 0) c.mask -= dt;
              const thr = c.mask > 0 ? TH * 1.9 : TH;
              if (c.smoker && c.mask > 0 && c.cig > 0) {
                c.cig = 0;
                c.cigCd = rnd(6, 9);
              }
              if (c.smoker && !(c.mask > 0)) {
                if (c.cig > 0) {
                  c.cig -= dt;
                  c.smokeAcc += dt;
                  while (c.smokeAcc > 0.26) {
                    c.smokeAcc -= 0.26;
                    addSmoke(c.px + 10 * S, c.hy + 4 * S);
                  }
                  if (c.cig <= 0) c.cigCd = rnd(9, 15);
                } else {
                  c.cigCd -= dt;
                  if (c.cigCd <= 0) {
                    c.cig = rnd(12, 16);
                    SFX.lighter();
                    if (!seenSmoker) {
                      seenSmoker = true;
                      state = "intro";
                      pointers.clear();
                      $("smokeOv").hidden = false;
                    } else if (up.sign && !signHint) {
                      signHint = true;
                      banner(T("signHintT"), T("signHintS"), "info", 3);
                    }
                  }
                }
              }
              if (t.dens > thr) {
                c.pat -=
                  (0.07 + (t.dens - thr) * 0.2) *
                  dt *
                  (c.smoker ? 0.5 : 1) *
                  (c.mask > 0 ? 0.5 : 1) *
                  (up.tv && blackT <= 0 ? 0.6 : 1);
                c.coughT -= dt;
                if (c.coughT <= 0 && !c.smoker) {
                  c.coughT = rnd(1.1, 2.5);
                  float(
                    t.x + (Math.random() - 0.5) * 40 * S,
                    t.y - 64 * S,
                    pick(T("cough")),
                    "#c9c3b0",
                    11,
                  );
                  if (clock - lastCough > 0.3) {
                    lastCough = clock;
                    SFX.cough();
                  }
                }
              } else {
                if (t.dens < thr * 0.7) c.pat = Math.min(1, c.pat + 0.05 * dt);
                c.ord -= dt * (t.dens < thr * 0.45 ? 1.3 : 1);
                if (c.ord <= 0) serve(t);
              }
              if (cat && cat.st === "sit" && cat.tgt === t) c.pat = Math.min(1, c.pat + 0.14 * dt);
              if (c.pat <= 0 && TM.god) c.pat = 0.05;
              if (c.pat <= 0) {
                c.state = "leave";
                c.t = 0;
                walk++;
                SFX.walkout();
                float(t.x, t.y - 66 * S, c.smoker ? T("smokerQuit") : T("quitF"), "#ff7a6b", 15);
                hud();
                if (walk >= MAXW) gameOver();
              }
            } else if (c.state === "leave") {
              if (c.t > 1.3) {
                t.cust = null;
                t.respawn = rnd(2, 4.5);
              }
            }
          }
          const target = 18 + (sum / 4) * 95 + parts.length * 0.12;
          api += (target - api) * Math.min(1, dt * 1.5);
          if (state === "play") peak = Math.max(peak, api);
          for (let i = floats.length - 1; i >= 0; i--) {
            floats[i].t += dt;
            if (floats[i].t > floats[i].life) floats.splice(i, 1);
          }
          for (let i = trails.length - 1; i >= 0; i--) {
            trails[i].t += dt;
            if (trails[i].t > 0.35) trails.splice(i, 1);
          }
        }

        function patCol(p) {
          return p > 0.6 ? "#7bd389" : p > 0.3 ? "#f2c14e" : "#ef5b4c";
        }

        function drawCust(c, t) {
          let x = c.px,
            y = c.py;
          const sick = c.state === "sit" && t.dens > TH && !c.smoker;
          if (sick) x += Math.sin(clock * 38) * 1.2 * S;
          ctx.globalAlpha = c.alpha;
          const s = S;
          ctx.fillStyle = c.shirt;
          rr(ctx, x - 19 * s, y - 2 * s, 38 * s, 36 * s, 12 * s);
          ctx.fill();
          const hy = y - 15 * s;
          let hr = 11.5 * s;
          if (c.hat === "cgirl" || c.hat === "igirl") {
            ctx.fillStyle = "#17110d";
            rr(ctx, x - 13.5 * s, hy - 6 * s, 27 * s, (c.hat === "igirl" ? 32 : 24) * s, 8 * s);
            ctx.fill();
          }
          if (c.hat === "tudung") {
            ctx.fillStyle = c.scarf;
            ctx.beginPath();
            ctx.ellipse(x, hy + 1 * s, 15.5 * s, 17 * s, 0, 0, 7);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x - 18 * s, y + 2 * s);
            ctx.quadraticCurveTo(x, y + 18 * s, x + 18 * s, y + 2 * s);
            ctx.lineTo(x + 10 * s, y - 6 * s);
            ctx.lineTo(x - 10 * s, y - 6 * s);
            ctx.fill();
            hr = 9.5 * s;
          }
          const fcy = hy + (c.hat === "tudung" ? 1.5 * s : 0);
          ctx.fillStyle = c.skin;
          ctx.beginPath();
          ctx.arc(x, fcy, hr, 0, 7);
          ctx.fill();
          const tint = Math.max(0, Math.min(1, (1 - c.pat) * 1.3 - 0.25));
          if (tint > 0) {
            ctx.fillStyle = `rgba(140,160,90,${tint * 0.45})`;
            ctx.beginPath();
            ctx.arc(x, fcy, hr, 0, 7);
            ctx.fill();
          }
          if (c.hat === "songkok") {
            ctx.fillStyle = "#161616";
            rr(ctx, x - 10.5 * s, hy - hr - 4 * s, 21 * s, 9 * s, 2 * s);
            ctx.fill();
          } else if (c.hat === "cgirl") {
            ctx.fillStyle = "#17110d";
            ctx.beginPath();
            ctx.arc(x, hy, hr + 0.6 * s, Math.PI, 0);
            ctx.lineTo(x + hr, hy - 2.5 * s);
            ctx.lineTo(x - hr, hy - 2.5 * s);
            ctx.closePath();
            ctx.fill();
          } else if (c.hat === "igirl") {
            ctx.fillStyle = "#17110d";
            ctx.beginPath();
            ctx.ellipse(x - 5 * s, hy - 7 * s, 7 * s, 5 * s, -0.35, 0, 7);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(x + 5 * s, hy - 7 * s, 7 * s, 5 * s, 0.35, 0, 7);
            ctx.fill();
          } else if (c.hat === "hair") {
            ctx.fillStyle = "#1f1612";
            ctx.beginPath();
            ctx.arc(x, hy, hr, Math.PI * 1.05, Math.PI * 1.95);
            ctx.lineTo(x + hr * 0.6, hy - hr * 0.35);
            ctx.lineTo(x - hr * 0.6, hy - hr * 0.35);
            ctx.fill();
          }
          const fy = hy + (c.hat === "tudung" ? 2 * s : 1 * s);
          ctx.strokeStyle = ctx.fillStyle = "#1b1410";
          ctx.lineWidth = 1.6 * s;
          ctx.lineCap = "round";
          if (c.pat < 0.35 || sick) {
            ctx.beginPath();
            ctx.moveTo(x - 6 * s, fy - 2 * s);
            ctx.lineTo(x - 2 * s, fy - 1 * s);
            ctx.moveTo(x + 6 * s, fy - 2 * s);
            ctx.lineTo(x + 2 * s, fy - 1 * s);
            ctx.stroke();
          } else {
            ctx.beginPath();
            ctx.arc(x - 4 * s, fy - 1.5 * s, 1.4 * s, 0, 7);
            ctx.arc(x + 4 * s, fy - 1.5 * s, 1.4 * s, 0, 7);
            ctx.fill();
          }
          ctx.beginPath();
          if (sick) {
            ctx.arc(x, fy + 4.5 * s, 2 * s, 0, 7);
            ctx.fill();
          } else if (c.pat > 0.5) {
            ctx.arc(x, fy + 2 * s, 3.5 * s, 0.2 * Math.PI, 0.8 * Math.PI);
            ctx.stroke();
          } else {
            ctx.moveTo(x - 3 * s, fy + 4.5 * s);
            ctx.lineTo(x + 3 * s, fy + 4.5 * s);
            ctx.stroke();
          }
          if (c.mask > 0) {
            const bl = c.mask < 3 && Math.sin(clock * 14) > 0;
            ctx.globalAlpha = c.alpha * (bl ? 0.45 : 1);
            ctx.strokeStyle = "#d8eef7";
            ctx.lineWidth = 1 * s;
            ctx.beginPath();
            ctx.moveTo(x - 8 * s, fy + 1 * s);
            ctx.lineTo(x - hr, fy - 2 * s);
            ctx.moveTo(x + 8 * s, fy + 1 * s);
            ctx.lineTo(x + hr, fy - 2 * s);
            ctx.stroke();
            ctx.fillStyle = "#bfe3f2";
            rr(ctx, x - 8.5 * s, fy - 0.5 * s, 17 * s, 9 * s, 3 * s);
            ctx.fill();
            ctx.strokeStyle = "#8fb9cc";
            ctx.beginPath();
            ctx.moveTo(x - 6 * s, fy + 2.5 * s);
            ctx.lineTo(x + 6 * s, fy + 2.5 * s);
            ctx.moveTo(x - 6 * s, fy + 5.5 * s);
            ctx.lineTo(x + 6 * s, fy + 5.5 * s);
            ctx.stroke();
            ctx.globalAlpha = c.alpha;
          }
          if (c.smoker && c.cig > 0 && !(c.mask > 0)) {
            ctx.strokeStyle = "#f1eee6";
            ctx.lineWidth = 2.2 * s;
            ctx.beginPath();
            ctx.moveTo(x + 2 * s, fy + 4 * s);
            ctx.lineTo(x + 10 * s, fy + 5 * s);
            ctx.stroke();
            ctx.fillStyle = `rgba(255,${(120 + Math.sin(clock * 6) * 40) | 0},40,1)`;
            ctx.beginPath();
            ctx.arc(x + 10.5 * s, fy + 5 * s, 1.6 * s, 0, 7);
            ctx.fill();
          }
          if (c.state === "sit") {
            ctx.strokeStyle = "rgba(0,0,0,.35)";
            ctx.lineWidth = 3 * s;
            ctx.beginPath();
            ctx.arc(x, hy, 19 * s, 0, 7);
            ctx.stroke();
            ctx.strokeStyle = patCol(c.pat);
            ctx.beginPath();
            ctx.arc(x, hy, 19 * s, -Math.PI / 2, -Math.PI / 2 + c.pat * Math.PI * 2);
            ctx.stroke();
            if (c.mask > 0) {
              const bl = c.mask < 3 && Math.sin(clock * 14) > 0;
              ctx.lineWidth = 2.5 * s;
              ctx.strokeStyle = "rgba(191,227,242,.22)";
              ctx.beginPath();
              ctx.arc(x, hy, 23.5 * s, 0, 7);
              ctx.stroke();
              ctx.strokeStyle = bl ? "rgba(191,227,242,.4)" : "#bfe3f2";
              ctx.beginPath();
              ctx.arc(
                x,
                hy,
                23.5 * s,
                -Math.PI / 2,
                -Math.PI / 2 + Math.min(1, c.mask / 12) * Math.PI * 2,
              );
              ctx.stroke();
            }
          }
          ctx.globalAlpha = 1;
        }

        function drawTable(t) {
          const s = S,
            x = t.x,
            y = t.y;
          ctx.fillStyle = "rgba(0,0,0,.35)";
          ctx.beginPath();
          ctx.ellipse(x, y + 38 * s, 30 * s, 8 * s, 0, 0, 7);
          ctx.fill();
          if (!t.cust || t.cust.state !== "sit") {
            ctx.fillStyle = "#b92e22";
            ctx.beginPath();
            ctx.ellipse(x, y - 16 * s, 13 * s, 6 * s, 0, 0, 7);
            ctx.fill();
            ctx.fillStyle = "#e04a3a";
            ctx.beginPath();
            ctx.ellipse(x, y - 18 * s, 13 * s, 6 * s, 0, 0, 7);
            ctx.fill();
          }
          if (t.cust) drawCust(t.cust, t);
          ctx.fillStyle = "#4a5352";
          ctx.fillRect(x - 3 * s, y + 6 * s, 6 * s, 32 * s);
          ctx.fillStyle = "#a9a596";
          ctx.beginPath();
          ctx.ellipse(x, y + 6 * s, 34 * s, 13 * s, 0, 0, 7);
          ctx.fill();
          ctx.fillStyle = "#efece4";
          ctx.beginPath();
          ctx.ellipse(x, y + 3 * s, 34 * s, 13 * s, 0, 0, 7);
          ctx.fill();
          ctx.fillStyle = "rgba(120,115,100,.18)";
          ctx.beginPath();
          ctx.ellipse(x - 10 * s, y + 1 * s, 9 * s, 3 * s, 0.4, 0, 7);
          ctx.fill();
          ctx.fillStyle = "#8c877a";
          ctx.font = `800 ${Math.round(8 * s)}px Figtree, sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(String(tables.indexOf(t) + 1), x - 22 * s, y + 8 * s);
          if (t.cust && t.cust.state !== "arrive") {
            const c = t.cust,
              lvl = c.state === "sit" ? Math.max(0, c.ord / c.ordMax) : 0.2,
              gx = x + 12 * s,
              gy = y - 12 * s,
              gw = 9 * s,
              gh = 15 * s;
            if (c.item === "roti") {
              drawRoti(x + 6 * s, y, lvl);
            } else {
              ctx.fillStyle = "rgba(255,255,255,.18)";
              rr(ctx, gx - gw / 2, gy, gw, gh, 2 * s);
              ctx.fill();
              const fh = gh * lvl;
              ctx.fillStyle = "#b97a45";
              rr(ctx, gx - gw / 2 + 1 * s, gy + gh - fh, gw - 2 * s, fh, 1.5 * s);
              ctx.fill();
              if (lvl > 0.75) {
                ctx.fillStyle = "#f1e0be";
                ctx.fillRect(gx - gw / 2 + 1 * s, gy + gh - fh, gw - 2 * s, 3 * s);
              }
              ctx.strokeStyle = "rgba(255,255,255,.55)";
              ctx.lineWidth = 1 * s;
              rr(ctx, gx - gw / 2, gy, gw, gh, 2 * s);
              ctx.stroke();
            }
            if (c.smoker) {
              ctx.fillStyle = "#8a8f93";
              ctx.beginPath();
              ctx.ellipse(x - 14 * s, y + 2 * s, 6 * s, 2.5 * s, 0, 0, 7);
              ctx.fill();
            }
          }
        }

        function drawKipas(x, y, rot, scale, tiredLook) {
          const s = S * scale;
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(rot);
          ctx.fillStyle = "#7a4b26";
          rr(ctx, -3 * s, -22 * s, 6 * s, 30 * s, 3 * s);
          ctx.fill();
          ctx.translate(0, -44 * s);
          ctx.fillStyle = tiredLook ? "#8f826a" : "#d9b36c";
          ctx.beginPath();
          ctx.arc(0, 0, 24 * s, 0, 7);
          ctx.fill();
          ctx.strokeStyle = "rgba(115,75,30,.4)";
          ctx.lineWidth = 1.2 * s;
          for (const r of [7, 13, 19]) {
            ctx.beginPath();
            ctx.arc(0, 0, r * s, 0, 7);
            ctx.stroke();
          }
          for (let i = 0; i < 12; i++) {
            const a = (i / 12) * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(a) * 24 * s, Math.sin(a) * 24 * s);
            ctx.stroke();
          }
          ctx.strokeStyle = "#8e6a2f";
          ctx.lineWidth = 2.5 * s;
          ctx.beginPath();
          ctx.arc(0, 0, 24 * s, 0, 7);
          ctx.stroke();
          ctx.restore();
        }
        function drawEfan(x, y, rot) {
          const s = S;
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(rot);
          ctx.fillStyle = "#e9eef0";
          rr(ctx, -4 * s, -20 * s, 8 * s, 30 * s, 4 * s);
          ctx.fill();
          ctx.translate(0, -42 * s);
          ctx.fillStyle = "#2f86c9";
          ctx.beginPath();
          ctx.arc(0, 0, 23 * s, 0, 7);
          ctx.fill();
          ctx.fillStyle = "rgba(220,240,255,.85)";
          const sp = clock * 40;
          for (let i = 0; i < 3; i++) {
            ctx.save();
            ctx.rotate(sp + i * 2.094);
            ctx.beginPath();
            ctx.ellipse(0, -10 * s, 5 * s, 10 * s, 0, 0, 7);
            ctx.fill();
            ctx.restore();
          }
          ctx.fillStyle = "#e9eef0";
          ctx.beginPath();
          ctx.arc(0, 0, 4 * s, 0, 7);
          ctx.fill();
          ctx.strokeStyle = "#e9eef0";
          ctx.lineWidth = 2 * s;
          ctx.beginPath();
          ctx.arc(0, 0, 23 * s, 0, 7);
          ctx.stroke();
          ctx.lineWidth = 0.8 * s;
          for (const r of [9, 16]) {
            ctx.beginPath();
            ctx.arc(0, 0, r * s, 0, 7);
            ctx.stroke();
          }
          ctx.restore();
        }
        function drawFan(p) {
          const wob = p.active ? Math.sin(clock * 22) * 0.08 : 0;
          let rot = Math.max(-0.6, Math.min(0.6, Math.cos(p.ang) * 0.5)) + wob;
          if (efanOn) {
            drawEfan(p.x, p.y, rot);
            return;
          }
          if (tired) rot = 0.9 + Math.sin(clock * 2) * 0.05;
          drawKipas(p.x, p.y, rot, 1, tired);
        }

        function drawStaff(s) {
          const x = s.x,
            y = s.y,
            k = S;
          const bob = s.st === "walk" ? Math.abs(Math.sin(clock * 10)) * 2 * k : 0;
          ctx.strokeStyle = "#2a2f33";
          ctx.lineWidth = 5 * k;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(x - 6 * k, y + 30 * k);
          ctx.lineTo(x - 6 * k, y + 46 * k);
          ctx.moveTo(x + 6 * k, y + 30 * k);
          ctx.lineTo(x + 6 * k, y + 46 * k);
          ctx.stroke();
          ctx.fillStyle = "#2d6a4f";
          rr(ctx, x - 17 * k, y - 4 * k - bob, 34 * k, 36 * k, 10 * k);
          ctx.fill();
          ctx.fillStyle = "#f2efe7";
          rr(ctx, x - 11 * k, y + 4 * k - bob, 22 * k, 28 * k, 4 * k);
          ctx.fill();
          const hy = y - 16 * k - bob;
          ctx.fillStyle = s.skin;

          ctx.fillStyle = "#f2efe7";
          ctx.beginPath();

          ctx.fillStyle = "#1b1410";
          ctx.beginPath();

          ctx.strokeStyle = "#d8eef7";
          ctx.lineWidth = 1 * k;
          ctx.beginPath();
          ctx.moveTo(x - 7.5 * k, hy + 4 * k);
          ctx.lineTo(x - 11 * k, hy + 1 * k);

          ctx.lineTo(x + 11 * k, hy + 1 * k);
          ctx.stroke();
          ctx.fillStyle = "#bfe3f2";
          rr(ctx, x - 8 * k, hy + 3 * k, 16 * k, 7.5 * k, 3 * k);
          ctx.fill();
          ctx.strokeStyle = "#8fb9cc";
          ctx.beginPath();

          ctx.lineTo(x + 5.5 * k, hy + 5.5 * k);

          ctx.lineTo(x + 5.5 * k, hy + 8 * k);

        function render() {
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
          ctx.drawImage(bg, 0, 0, W, H);
          if (Math.sin(clock * 13) > 0.985 || Math.random() < 0.004) {
            ctx.fillStyle = "rgba(0,0,0,.12)";
            ctx.fillRect(0, roofH, W, H - roofH);
          }
          const ents = tables
            .map((t) => ({ y: t.y, f: () => drawTable(t) }))
            .concat(staff.map((s) => ({ y: s.y + 12 * S, f: () => drawStaff(s) })));
          purifs.forEach((o, i) => {
            if (o) ents.push({ y: purPos(i).y, f: () => drawPurifier(i) });

          if (up.tv) drawTV();
          ents.sort((a, b) => a.y - b.y).forEach((e) => e.f());
          for (const p of parts) {
            ctx.globalAlpha = p.w;
            const r = p.r * 1.3;
            ctx.drawImage(SPR[p.kind], p.x - r, p.y - r, r * 2, r * 2);
          }
          ctx.globalAlpha = 1;
          const tint = Math.min(0.34, Math.max(0, (api - 40) / 700));
          if (tint > 0) {
            ctx.fillStyle = fireT > 0 ? `rgba(170,110,60,${tint})` : `rgba(170,148,96,${tint})`;
            ctx.fillRect(0, 0, W, H);
          }
          if (blackT > 0 && !((blackT > blackDur - 0.6 || blackT < 0.6) && Math.random() < 0.4)) {
            ctx.fillStyle = "rgba(8,10,18,.42)";
            ctx.fillRect(0, 0, W, H);

          ctx.lineCap = "round";
          for (const tr of trails) {
            const q = 1 - tr.t / 0.35,
              len = (18 + 40 * tr.s) * S;
            ctx.strokeStyle = tr.e
              ? `rgba(150,210,255,${q * 0.6})`
              : `rgba(240,250,240,${q * 0.45})`;
            ctx.lineWidth = 2 * S;
            for (const o of [-9, 0, 9]) {
              const ox = -tr.uy * o * S,
                oy = tr.ux * o * S;
              ctx.beginPath();
              ctx.moveTo(tr.x + ox, tr.y + oy);
              ctx.lineTo(
                tr.x + ox - tr.ux * len * (o ? 0.6 : 1),
                tr.y + oy - tr.uy * len * (o ? 0.6 : 1),
              );
              ctx.stroke();
            }
          }
          if (state === "play") pointers.forEach(drawFan);
          if (armed && state === "play") {
            const col = armed === "mask" ? "191,227,242" : "255,138,124";
            for (const t of tables) {
              const c = t.cust;
              if (
                c &&
                c.state === "sit" &&
                (armed === "mask"
                  ? !(c.mask > 0) && !(c.smoker && c.cig > 0)

              ) {
                ctx.strokeStyle = `rgba(${col},${0.45 + 0.4 * Math.sin(clock * 8)})`;
                ctx.lineWidth = 2.5 * S;
                ctx.beginPath();
                ctx.arc(c.px, c.hy, 25 * S, 0, 7);
                ctx.stroke();
              }
            }
          }
          if (drag && drag.moved > 10 && state === "play" && drag.tool === "sign") {
            const my = drag.y - 34 * S,
              tc = toolTarget("sign", drag.x, my),
              r = 14 * S;
            if (tc) {
              ctx.strokeStyle = "rgba(255,138,124,.95)";
              ctx.lineWidth = 3 * S;
              ctx.setLineDash([5 * S, 4 * S]);
              ctx.beginPath();
              ctx.arc(tc.px, tc.hy, 27 * S, 0, 7);
              ctx.stroke();
              ctx.setLineDash([]);
            }
            ctx.fillStyle = "#f4f1ea";
            ctx.beginPath();
            ctx.arc(drag.x, my, r, 0, 7);
            ctx.fill();
            ctx.fillStyle = "#555";
            ctx.fillRect(drag.x - 8 * S, my - 1.6 * S, 12 * S, 3.2 * S);
            ctx.fillStyle = "#f08a3c";
            ctx.fillRect(drag.x + 4 * S, my - 1.6 * S, 3 * S, 3.2 * S);
            ctx.strokeStyle = "#d63a2c";
            ctx.lineWidth = 3.2 * S;
            ctx.beginPath();
            ctx.arc(drag.x, my, r, 0, 7);
            ctx.moveTo(drag.x - r * 0.7, my - r * 0.7);
            ctx.lineTo(drag.x + r * 0.7, my + r * 0.7);

          if (drag && drag.moved > 10 && state === "play" && drag.tool === "mask") {

            const k = S * 1.4;

            ctx.quadraticCurveTo(drag.x - 15 * k, my, drag.x - 10 * k, my + 3 * k);
            ctx.moveTo(drag.x + 10 * k, my - 3 * k);

            ctx.stroke();
            ctx.fillStyle = "#bfe3f2";
