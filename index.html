            row.className = "item";
            const pips =
              max > 1 && !it.repeat
                ? `<span class="pips">${Array.from({ length: max }, (_, i) => `<i class="${i < lvl ? "on" : ""}"></i>`).join("")}</span>`
                : "";
            row.innerHTML = itemHead(it, pips);
            const b = document.createElement("button");
            b.className = "buy";
            b.id = "buy-" + it.id;
            if (lvl >= max) {
              b.textContent = max > 1 ? T("max") : T("owned");
              b.disabled = true;
              b.classList.add("own");
            } else {
              b.textContent = "RM" + price;
              b.disabled = wallet < price;
              b.addEventListener("click", () => {
                if (wallet < price) return;
                wallet -= price;
                SFX.buy();
                if (it.repeat) {
                  masks += it.qty;
                  everMask = true;
                } else up[it.id]++;
                renderShop();
                hud();
              });
            }
            row.appendChild(b);
            box.appendChild(row);
          }
        }
        $("copyRes").addEventListener("click", () => {
          const b = $("copyRes"),
            ta = $("shareTxt"),
            txt = F("share", {
              n: night - 1,
              o: soldTotal,
              rm: Math.round(earnedTotal),
              a: Math.round(peak),
            });
          const done = () => {
            SFX.tick();
            b.textContent = T("copied");
            clearTimeout(b._t);
            b._t = setTimeout(() => {
              b.textContent = T("copyBtn");
            }, 2000);
          };
          const fallback = () => {
            ta.value = txt;
            ta.hidden = false;
            ta.focus();
            ta.select();
            try {
              if (document.execCommand("copy")) done();
            } catch (e) {}
          };
          try {
            navigator.clipboard.writeText(txt).then(done, fallback);
          } catch (e) {
            fallback();
          }
        });
        function gameOver() {
          $("shareTxt").hidden = true;
          $("copyRes").textContent = T("copyBtn");
          state = "over";
          pointers.clear();
          ambStop();
          $("sNights").textContent = night - 1;
          $("sSold").textContent = soldTotal;
          $("sRm").textContent = "RM" + Math.round(earnedTotal);
          $("sApi").textContent = Math.round(peak);
          $("overT").textContent = overTitle();
          $("best2").textContent = bestLine();
          setTimeout(() => {
            $("banner").hidden = true;
            $("over").hidden = false;
          }, 800);
        }
        // --- secret test mode: tap the title 5 times, or open the link with #test
        const TM = { on: false, god: false, speed: 1, unlock: false };
        function tmSet(on) {
          TM.on = on;
          $("tm").hidden = !on;
          if (!on) {
            TM.god = false;
            TM.speed = 1;
            TM.unlock = false;
          }
          tmSync();
          try {
            sessionStorage.setItem("ttj-test", on ? "1" : "0");
          } catch (e) {}
        }
        function tmSync() {
          $("tmGod").setAttribute("aria-pressed", String(TM.god));
          $("tmUnlock").setAttribute("aria-pressed", String(TM.unlock));
          document
            .querySelectorAll("[data-sp]")
            .forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.sp === TM.speed)));
          $("tmNight").value = night;
        }
        let tmTaps = [];
        $("title").addEventListener("click", () => {
          const n = performance.now();
          tmTaps = tmTaps.filter((t) => n - t < 2000);
          tmTaps.push(n);
          if (tmTaps.length >= 5) {
            tmTaps = [];
            tmSet(!TM.on);
            SFX.tick();
          }
        });
        $("tmTab").addEventListener("click", () => {
          const b = $("tmBody");
          b.hidden = !b.hidden;
          $("tmTab").setAttribute("aria-expanded", String(!b.hidden));
        });
        function tmEnsureRun() {
          if (state === "menu" || state === "over") {
            newGame();
            if (TM.unlock) tmUnlockApply();
          }
        }
        function tmUnlockApply() {
          const sg = SHOP.find((i) => i.id === "sign");
          if (TM.unlock) {
            SHOP.forEach((i) => {
              if (i._from == null) i._from = i.from;
              i.from = 0;
            });
          } else {
            SHOP.forEach((i) => {
              if (i._from != null) {
                i.from = i._from;
                delete i._from;
              }
            });
            if (smokerNight) sg.from = smokerNight;
          }
        }
        $("tmGo").addEventListener("click", () => {
          const n = Math.max(1, Math.min(30, parseInt($("tmNight").value) || 1));
          tmEnsureRun();
          night = n;
          if (n > 7 && !smokerNight) {
            smokerNight = 7;
            SHOP.find((i) => i.id === "sign").from = TM.unlock ? 0 : 7;
          }
          state = "shop";
          pointers.clear();
          drag = null;
          armed = null;
          sum = {
            n: n - 1,
            walk: 0,
            sold: 0,
            teh: 0,
            roti: 0,
            staff: 0,
            wages: 0,
            net: 0,
            bill: billNo,
            quit: [],
          };
          ["start", "over", "smokeOv"].forEach((id) => ($(id).hidden = true));
          $("banner").hidden = true;
          shopText();
          renderShop();
          $("shopOv").hidden = false;
          scrollToNew();
          hud();
          tmSync();
        });
        document.querySelectorAll("[data-rm]").forEach((b) =>
          b.addEventListener("click", () => {
            tmEnsureRun();
            wallet += +b.dataset.rm;
            hud();
            if (state === "shop") renderShop();
          }),
        );
        $("tmMasks").addEventListener("click", () => {
          tmEnsureRun();
          masks += 10;
          everMask = true;
          hud();
          if (state === "shop") renderShop();
        });
        $("tmEnd").addEventListener("click", () => {
          if (state === "intro") {
            $("smokeOv").hidden = true;
            state = "play";
          }
          if (state === "play") {
            endNight();
            tmSync();
          }
        });
        $("tmFire").addEventListener("click", () => {
          if (state === "play")
            fires.push({
              at: nightT,
              dur: rnd(4, 6.5),
              spots: Math.round(rnd(120, 300) + night * 40),
              done: false,
            });
        });
        $("tmBlack").addEventListener("click", () => {
          if (state === "play") blackouts.push({ at: nightT, dur: rnd(5, 7.5), done: false });
        });
        $("tmSmoke").addEventListener("click", () => {
          if (state !== "play") return;
          const t =
            tables.find((t) => t.cust && t.cust.state === "sit" && !t.cust.smoker) ||
            tables.find((t) => t.cust && t.cust.state === "sit");
          if (t) {
            const c = t.cust;
            c.smoker = true;
            c.mask = 0;
            c.cig = 0;
            c.cigCd = 0.1;
          }
        });
        document.querySelectorAll("[data-sp]").forEach((b) =>
          b.addEventListener("click", () => {
            TM.speed = +b.dataset.sp;
            tmSync();
          }),
        );
        $("tmGod").addEventListener("click", () => {
          TM.god = !TM.god;
          tmSync();
        });
        $("tmUnlock").addEventListener("click", () => {
          TM.unlock = !TM.unlock;
          tmUnlockApply();
          tmSync();
          if (state === "shop") renderShop();
        });
        $("tmOff").addEventListener("click", () => {
          TM.unlock = false;
          tmUnlockApply();
          tmSet(false);
          if (state === "shop") renderShop();
        });
        try {
          if (location.hash === "#test" || sessionStorage.getItem("ttj-test") === "1") tmSet(true);
        } catch (e) {
          if (location.hash === "#test") tmSet(true);
        }

        $("go").addEventListener("click", newGame);
        $("again").addEventListener("click", newGame);
        $("next").addEventListener("click", startNight);

        // --- input
        function tapAt(x, y) {
          if (armed) {
            const c = toolTarget(armed, x, y);
            if (c) applyTool(armed, c);
            armed = null;
            updTray();
            return true;
          }
          return false;
        }
        cv.addEventListener("pointerdown", (e) => {
          try {
            cv.setPointerCapture(e.pointerId);
          } catch (_) {}
          pointers.set(e.pointerId, {
            x: e.clientX,
            y: e.clientY,
            t: performance.now(),
            st: performance.now(),
            moved: 0,
            ang: -Math.PI / 2,
            active: false,
          });
        });
        cv.addEventListener("pointermove", (e) => {
          let p = pointers.get(e.pointerId);
          if (!p) {
            if (e.pointerType !== "mouse") return;
            p = {
              x: e.clientX,
              y: e.clientY,
              t: performance.now(),
              st: 0,
              moved: 99,
              ang: -Math.PI / 2,
              active: false,
              hover: true,
            };
            pointers.set(e.pointerId, p);
          }
          const now = performance.now(),
            dt = Math.max(8, now - p.t) / 1000,
            dx = e.clientX - p.x,
            dy = e.clientY - p.y,
            d = Math.hypot(dx, dy);
          if (d > 1.5) {
            const sp = d / dt;
            p.ang = Math.atan2(dy, dx);
            if (!p.hover || e.buttons) {
              p.moved += d;
              if (state === "play") {
                let power = 0;
                if (efanOn) {
                  batt = Math.max(0, batt - (d / S) * battSwipe());
                  power = 1.8;
                } else if (!tired) {
                  stam -= (d / S) * 0.075;
                  power = 1;
                  lastSwipe = clock;
                  if (stam <= 0) {
                    stam = 0;
                    tired = true;
                    SFX.tired();
                  }
                } else lastSwipe = Math.min(lastSwipe, clock);
                if (power) {
                  gust(p.x, p.y, e.clientX, e.clientY, sp, power);
                  if (sp > 500 && clock - lastWhoosh > 0.13) {
                    lastWhoosh = clock;
                    SFX.whoosh(Math.min(1, sp / 2000), efanOn);
                  }
                  if (sp > 250)
                    trails.push({
                      x: e.clientX,
                      y: e.clientY,
                      ux: dx / d,
                      uy: dy / d,
                      s: Math.min(1, sp / 1600),
                      t: 0,
                      e: efanOn,
                    });
                }
              }
              p.active = true;
            }
          }
          p.x = e.clientX;
          p.y = e.clientY;
          p.t = now;
        });
        const upH = (e) => {
          const p = pointers.get(e.pointerId);
          if (!p) return;
          if (
            e.type === "pointerup" &&
            state === "play" &&
            p.moved < 12 &&
            performance.now() - p.st < 400
          )
            tapAt(e.clientX, e.clientY);
          if (e.pointerType === "mouse" && e.type === "pointerup") {
            p.hover = true;
            p.active = false;
            p.moved = 99;
          } else pointers.delete(e.pointerId);
        };
        cv.addEventListener("pointerup", upH);
        cv.addEventListener("pointercancel", upH);
        cv.addEventListener("pointerleave", (e) => pointers.delete(e.pointerId));
        cv.addEventListener("contextmenu", (e) => e.preventDefault());

        function toolTarget(tool, x, y) {
          let bc = null,
            bd = 80 * S;
          for (const t of tables) {
            const c = t.cust;
            if (!c || c.state !== "sit") continue;
            if (tool === "mask" ? c.mask > 0 || (c.smoker && c.cig > 0) : !(c.smoker && c.cig > 0))
              continue;
            const d = Math.hypot(x - c.px, y - c.hy);
            if (d < bd) {
              bd = d;
              bc = c;
            }
          }
          return bc;
        }
        function applyTool(tool, c) {
          if (tool === "mask") {
            c.mask = 12;
            masks--;
            SFX.mask();
            float(c.px, c.hy - 30 * S, T("masked"), "#bfe3f2", 13);
          } else {
            c.cig = 0;
            c.cigCd = rnd(14, 20);
            signCd = SIGNCD;
            SFX.stamp();
            float(c.px, c.hy - 30 * S, T("out"), "#ff8a7c", 13);
          }
          updTray();
        }
        function toolReady(tool) {
          return tool === "mask" ? masks > 0 : !!up.sign && signCd <= 0;
        }
        function updTray() {
          const tr = $("tray");
          tr.hidden = masks <= 0 && !everMask;
          $("maskN").textContent = "×" + masks;
          tr.disabled = masks <= 0;
          const st = $("signTray");
          st.hidden = !up.sign;
          st.disabled = signCd > 0;
          const sn = signCd > 0 ? Math.ceil(signCd) + "s" : T("drag");
          st.classList.toggle(
            "nudge",
            signCd <= 0 &&
              armed !== "sign" &&
              !drag &&
              tables.some(
                (t) => t.cust && t.cust.state === "sit" && t.cust.smoker && t.cust.cig > 0,
              ),
          );
          if ($("signN").textContent !== sn) $("signN").textContent = sn;
          $("blowTray").hidden = !up.blower;
          $("blowN").textContent = T("blowGo");
          if (armed && !toolReady(armed)) armed = null;
          tr.classList.toggle("armed", armed === "mask");
          st.classList.toggle("armed", armed === "sign");
        }
        function setupTray(el, tool) {
          el.addEventListener("pointerdown", (e) => {
            if (state !== "play" || !toolReady(tool)) return;
            e.preventDefault();
            try {
              el.setPointerCapture(e.pointerId);
            } catch (_) {}
            drag = {
              tool,
              id: e.pointerId,
              x: e.clientX,
              y: e.clientY,
              sx: e.clientX,
              sy: e.clientY,
              moved: 0,
            };
          });
          el.addEventListener("pointermove", (e) => {
            if (!drag || drag.id !== e.pointerId) return;
            drag.x = e.clientX;
            drag.y = e.clientY;
            drag.moved = Math.max(drag.moved, Math.hypot(drag.x - drag.sx, drag.y - drag.sy));
          });
          const end = (e) => {
            if (!drag || drag.id !== e.pointerId) return;
            const d = drag;
            drag = null;
            if (e.type !== "pointerup" || state !== "play") return;
            if (d.moved < 10) {
              armed = armed === tool ? null : tool;
              updTray();
              return;
            }
            const c = toolTarget(tool, e.clientX, e.clientY - 34 * S);
            if (c) applyTool(tool, c);
          };
          el.addEventListener("pointerup", end);
          el.addEventListener("pointercancel", end);
        }
        setupTray($("tray"), "mask");
        setupTray($("signTray"), "sign");

        function blast() {
          if (state !== "play" || !up.blower) return;
          up.blower = 0;
          const cx = W / 2,
            cy = (topH + H) / 2,
            sp = 1500 * S;
          for (const p of parts) {
            const dx = p.x - cx,
              dy = p.y - cy,
              n = Math.hypot(dx, dy) || 1;
            p.px = (dx / n) * sp;
            p.py = (dy / n) * sp;
            p.blown = true;
          }
          SFX.whoosh(1, true);
          SFX.whoosh(1, false);
          float(cx, cy, T("blown"), "#bfe3f2", 22);
          updTray();
        }
        $("blowTray").addEventListener("click", blast);

        addEventListener("resize", resize);
        resize();
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawBG);
        for (let i = 0; i < 40; i++) {
          addPart();
          const p = parts[parts.length - 1];
          if (p) {
            p.x = Math.random() * W;
            p.y = topH + Math.random() * (H - topH);
            p.f = 1;
          }
        }
        tables.forEach((t) => {
          t.cust = newCust();
          t.cust.state = "sit";
          t.cust.pat = 0.6 + Math.random() * 0.4;
        });
        hud();
        applyLang();

        let last = performance.now();
        function frame(now) {
          const dt =
            Math.min(0.05, (now - last) / 1000) *
            (drag && drag.moved > 10 && state === "play" ? 0.35 : 1);
          last = now;
          if (state === "menu" && parts.length < 40) addPart();
          for (let k = 0; k < TM.speed; k++) update(dt);
          render();
          hudFrame();
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
