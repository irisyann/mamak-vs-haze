<title>Mamak vs Haze</title>

<style>
/* Layout: full-bleed canvas night scene at a mamak stall; HUD on the zinc roof, arm/e-fan dock at the bottom, cards float centre. Deliberately single-theme (night). */
:root{
  --night:#171c1e; --panel:#222a2c; --line:#3a4447;
  --tube:#eaf6e8; --stool:#d63a2c; --teh:#d9a066; --haze:#c4b692; --fire:#f08a3c; --volt:#5fb8ff;
  --ink:#f3eee3; --muted:#a6ab9f;
  --display:"Bungee","Impact","Arial Black",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
.hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.chip{background:rgba(23,28,30,.84);border:1px solid var(--line);border-radius:10px}
.api{display:flex;flex-direction:column;padding:5px 9px;min-width:0}
.api-row{display:flex;align-items:baseline;gap:5px}
.api-k{font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:800}
.api b{font-family:var(--display);font-weight:400;font-size:19px;font-variant-numeric:tabular-nums;line-height:1}
.api #apiL{font-size:10px;font-weight:600;white-space:nowrap}
.till{display:flex;flex-direction:column;align-items:center;padding:5px 10px}
.till b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--teh);font-variant-numeric:tabular-nums;line-height:1.1}
.till span{font-size:10px;color:var(--muted);letter-spacing:.06em;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.stools{display:flex;gap:2px;padding:6px 7px}
.stools svg{width:14px;height:17px;transition:transform .3s,opacity .3s}
.stools svg.gone{opacity:.28;transform:rotate(80deg) translateY(3px)}
.banner{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 64px);z-index:6;width:min(360px,calc(100% - 32px));
  background:rgba(60,28,12,.9);border:1px solid var(--fire);border-radius:12px;padding:8px 12px;text-align:center;pointer-events:none}
.banner b{display:block;font-family:var(--display);font-weight:400;font-size:13px;color:var(--fire);letter-spacing:.02em}
.banner span{font-size:12px;color:var(--ink)}
.banner.fire{animation:flash .45s steps(2,jump-none) infinite}
@keyframes flash{50%{background:rgba(170,52,14,.95);border-color:#ffd27a}}
@media (prefers-reduced-motion:reduce){.banner.fire{animation:none}}
.banner.info{background:rgba(23,28,30,.9);border-color:var(--line)}
.banner.info b{color:var(--teh)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding-top:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.arm{flex:1;max-width:240px;padding:7px 10px;display:flex;flex-direction:column;gap:5px}
.arm .lbl{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.12em;font-weight:800;color:var(--muted)}
.arm .lbl em{font-style:normal;color:var(--ink)}
.bar{height:9px;border-radius:5px;background:#11161a;overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:5px;background:var(--teh);transition:background .2s}
.arm.tired .bar i{background:var(--stool)}
.arm.tired .bar{animation:flashred .35s steps(2,jump-none) infinite}
.arm.tired{border-color:var(--stool)}
@keyframes flashred{50%{background:#8a2018}}
@media (prefers-reduced-motion:reduce){.arm.tired .bar{animation:none}}
.snd{pointer-events:auto;flex:none;width:40px;height:40px;border-radius:50%;padding:0;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.snd svg{width:20px;height:20px}
.snd[aria-pressed="false"]{color:var(--muted)}
.snd[aria-pressed="false"] .wave{display:none}
.snd:not([aria-pressed="false"]) .x{display:none}
.tray{pointer-events:auto;touch-action:none;flex:none;height:56px;min-width:50px;padding:4px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:grab;color:var(--ink);font:inherit}
.tray svg{width:30px;height:20px}
.tray b{font-family:var(--display);font-weight:400;font-size:13px;font-variant-numeric:tabular-nums}
.tray.armed{border-color:#bfe3f2;box-shadow:0 0 0 2px #bfe3f2}
.tray:disabled{opacity:.4}
.arm.tired .lbl em{color:var(--stool)}
.arm.powered .bar i{background:var(--volt)}
.efan.charging::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 78%,rgba(255,255,255,.6) 92%,transparent);animation:spin 1.1s linear infinite;z-index:1;pointer-events:none}
.efan .bolt{position:absolute;z-index:3;left:50%;top:-14px;width:16px;height:22px;margin-left:-8px;display:none;background:var(--volt);clip-path:polygon(60% 0,10% 55%,45% 55%,35% 100%,90% 40%,55% 40%);animation:pulse .8s ease-in-out infinite}
.efan.charging .bolt{display:block}
.efan.charging span{color:var(--volt);z-index:2}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){.efan.charging::before,.efan .bolt{animation:none}}
.efan{pointer-events:none;position:relative;width:64px;height:64px;border-radius:50%;padding:0;flex:none;
  background:conic-gradient(var(--volt) calc(var(--b,1)*360deg),#2c3538 0);box-shadow:0 4px 0 #0c1012;border:0;cursor:pointer}
.efan span{z-index:2;position:absolute;inset:5px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-family:var(--display);font-size:11px;color:var(--ink);line-height:1.05;text-align:center}
.efan[aria-pressed="true"] span{background:#123247;color:var(--volt)}
.efan.low span{color:var(--muted)}
.efan:focus-visible{outline:3px solid var(--tube);outline-offset:3px}
.ov{position:fixed;inset:0;z-index:10;display:flex;overflow-y:auto;background:rgba(15,18,19,.6);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 20px)}
.card{margin:auto;width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}
h1{font-family:var(--display);font-weight:400;font-size:32px;line-height:1;margin:0;color:var(--teh);text-wrap:balance}
h1 span{display:block;color:var(--haze);font-size:.62em;margin-top:4px}
h2{font-family:var(--display);font-weight:400;font-size:15px;margin:0;color:var(--ink);letter-spacing:.02em}
.card p{margin:0;line-height:1.5;font-size:15px}
.how{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.how li{display:flex;gap:10px;font-size:14px;line-height:1.4;color:var(--muted)}
.how li b{color:var(--ink);font-weight:600}
.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--night);border-radius:10px;padding:9px 12px}
.stat small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800}
.stat b{font-family:var(--display);font-weight:400;font-size:20px;font-variant-numeric:tabular-nums}
.stat b.neg{color:var(--stool)}
.wallet{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:12px}
.wallet b{font-family:var(--display);font-weight:400;font-size:24px;color:var(--teh);font-variant-numeric:tabular-nums}
.shop{display:grid;gap:8px;max-height:min(260px,38vh);overflow-y:auto;overscroll-behavior:contain;padding-right:2px;margin-right:-2px}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--night);border-radius:12px;padding:10px 12px}
.item>div{min-width:0}
.item h3{margin:0;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pips{display:inline-flex;gap:3px}
.card p.quit{font-size:14px;color:#ff8a7c;background:rgba(214,58,44,.12);border:1px solid rgba(214,58,44,.4);border-radius:10px;padding:9px 12px}
.place{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);font-weight:600}
.place button{font:inherit;font-weight:800;min-width:34px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.place button.warn{border-color:var(--stool);color:#ff8a7c}
.place button:disabled:not([aria-pressed="true"]){opacity:.45;cursor:default}
.place button[aria-pressed="true"]{cursor:default;background:var(--volt);color:#0c2233;border-color:var(--volt)}
.new{font-size:9px;letter-spacing:.1em;background:var(--fire);color:#2a1206;border-radius:4px;padding:2px 5px;font-weight:800}
.pips i{width:7px;height:7px;border-radius:50%;background:#3a4447}
.pips i.on{background:var(--teh)}
.item p{font-size:12.5px;line-height:1.4;color:var(--muted);margin-top:3px}
.buy{font-family:var(--display);font-size:13px;padding:9px 11px;border-radius:10px;border:0;background:var(--teh);color:#2a1a0c;cursor:pointer;box-shadow:0 3px 0 #8a5a2c;white-space:nowrap;font-variant-numeric:tabular-nums}
.buy:disabled{background:#3a4447;color:var(--muted);box-shadow:none;cursor:default}
.forecast{font-size:13px;line-height:1.45;color:var(--muted);background:var(--night);border-radius:10px;padding:10px 12px}
.forecast b{color:var(--fire);font-weight:800}
.go{font-family:var(--display);font-size:18px;color:#fff;background:var(--stool);border:0;border-radius:12px;padding:14px 18px;cursor:pointer;box-shadow:0 4px 0 #8f2219}
.go:active,.buy:active{transform:translateY(3px);box-shadow:none}
button:focus-visible{outline:3px solid var(--tube);outline-offset:3px}
.best{font-size:13px;color:var(--muted);text-align:center}
#shopOv .card{gap:10px;padding-block:16px}
#shopOv h1{font-size:22px}
#shopOv .stats{grid-template-columns:repeat(4,1fr);gap:5px}
#shopOv .stat{padding:5px 6px;text-align:center}
#shopOv .stat small{font-size:8.5px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#shopOv .stat b{font-size:14px}
#shopOv .wallet{padding-top:8px}
#shopOv .wallet b{font-size:22px}
#shopOv .shop{position:relative;max-height:min(380px,52vh)}
#shopOv .new{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){#shopOv .new{animation:none}}
.tm{position:fixed;z-index:30;left:max(10px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 70px);font-family:var(--body);font-size:12px;max-width:calc(100% - 20px)}
.tm-tab{font-family:var(--display);font-size:11px;background:#7b2cbf;color:#fff;border:0;border-radius:8px;padding:5px 9px;cursor:pointer}
.tm-body{margin-top:6px;background:rgba(18,14,28,.94);border:1px solid #7b2cbf;border-radius:12px;padding:10px;display:grid;gap:7px;width:270px;max-width:100%}
.tm-row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tm-row label,.tm-row span{color:var(--muted);font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-right:2px}
.tm-row input{width:56px;font:inherit;font-weight:800;padding:5px 6px;border-radius:7px;border:1px solid var(--line);background:var(--night);color:var(--ink)}
.tm-row button{font:inherit;font-weight:700;padding:6px 8px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.tm-row button[aria-pressed="true"]{background:#7b2cbf;border-color:#a66be0;color:#fff}
.sep{display:inline-block;width:8px}
.place .price{margin-left:auto;color:var(--teh);font-weight:800}
.filts{grid-column:1/-1;display:grid;gap:6px}
.filt{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:9px;padding:6px 8px}
.filt .tno{font-weight:800;font-size:13px;min-width:0}
.filt .st{font-size:12px;color:var(--muted);flex:1}
.filt.dirty .st{color:#ff8a7c;font-weight:700}
.life{display:inline-flex;gap:3px}
.life i{width:14px;height:6px;border-radius:3px;background:#3a4447}
.life i.on{background:var(--volt)}
.filt .buy{padding:6px 9px;font-size:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.langs{display:flex;gap:4px;flex:none}
.langs button{font:inherit;font-size:11px;font-weight:800;letter-spacing:.08em;padding:5px 9px;border-radius:7px;border:1px solid var(--line);background:var(--night);color:var(--muted);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--teh);color:#2a1a0c;border-color:var(--teh)}
#signTray{cursor:grab}
#signTray.nudge{animation:nudge 1s ease-in-out infinite;border-color:#ff8a7c}
@keyframes nudge{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(-7px) rotate(-7deg)}40%{transform:translateY(0) rotate(6deg)}60%{transform:translateY(-3px) rotate(0)}}
@media (prefers-reduced-motion:reduce){#signTray.nudge{animation:none}}
#signTray.armed{border-color:#ff8a7c;box-shadow:0 0 0 2px #ff8a7c}
</style>

<script>
(()=>{
const $=id=>document.getElementById(id);

  cv.width=W*DPR;cv.height=H*DPR;S=Math.max(.8,Math.min(W,H)/400);

  tables.forEach((t,i)=>{t.x=W*pos[i][0];t.y=topH+(H-topH)*pos[i][1];});

}

  const ch=Math.max(18*S,(topH-roofH)*.2),cy=topH-ch;

function addPart(side,kind){
  kind=kind||'haze';
  if(parts.length>(kind==='smoke'?470:420))return;
  if(side==null){const r=Math.random();side=r<.4?0:r<.8?1:2;}
  let x,y;
  if(side===0){x=-50*S;y=topH*.6+Math.random()*(H-topH*.6);}
  else if(side===1){x=W+50*S;y=topH*.6+Math.random()*(H-topH*.6);}

  let tx,ty;
  if(Math.random()<.55){const t=tables[Math.random()*4|0];tx=t.x+(Math.random()-.5)*90*S;ty=t.y+(Math.random()-.5)*70*S;}
  else{tx=Math.random()*W;ty=topH+Math.random()*(H-topH);}
  const sp=(11+Math.random()*15)*S*(1+Math.min(nightT*TS,90)/260+(night-1)*.06)*(kind==='thick'?.8:1);
  const d=Math.hypot(tx-x,ty-y)||1;

function gust(x0,y0,x1,y1,speed,power){
  const dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy);if(L<1)return;
  const ux=dx/L,uy=dy/L,R=(power>1?70:58)*S,sp=Math.min(speed,2600)*.36*power,heavy=fireT>0?1.5:1;
  for(const p of parts){
    const t=Math.max(0,Math.min(L,(p.x-x0)*ux+(p.y-y0)*uy));
    const ex=p.x-(x0+ux*t),ey=p.y-(y0+uy*t),d=Math.hypot(ex,ey),rr2=R+p.r*.5;
    if(d<rr2){const f=(1-d/rr2)/(p.m*heavy),n=d||1;
      p.px+=ux*sp*f+ex/n*sp*f*.18;p.py+=uy*sp*f+ey/n*sp*f*.18;
      const m=Math.hypot(p.px,p.py),cap=1500*S;if(m>cap){p.px*=cap/m;p.py*=cap/m;}}

function custPos(c,t){

function staffUpdate(dt){
  for(const s of staff){
    s.t+=dt;
    if(s.st==='idle'){
      if(s.t>.3){s.t=0;let bt=null,bd=.55;
        for(const t of tables){if(staff.some(o=>o!==s&&o.tgt===t))continue;if(t.dens>bd){bd=t.dens;bt=t;}}
        if(bt){s.tgt=bt;s.side=s.x<bt.x?-1:1;s.st='walk';}}
    }else if(s.st==='walk'){
      const tx=s.tgt.x+s.side*48*S,ty=s.tgt.y-4*S,dx=tx-s.x,dy=ty-s.y,d=Math.hypot(dx,dy),sp=150*S*dt;
      if(d<=sp){s.x=tx;s.y=ty;s.st='fan';s.t=0;}else{s.x+=dx/d*sp;s.y+=dy/d*sp;}
    }else if(s.st==='fan'){
      const cx=s.tgt.x,cy=s.tgt.y-14*S,R=105*S,R2=R*R,heavy=fireT>0?1.5:1;
      for(const p of parts){const dx=p.x-cx,dy=p.y-cy,d2=dx*dx+dy*dy;if(d2>R2)continue;
        const ex=p.x-s.x,ey=p.y-s.y,n=Math.hypot(ex,ey)||1,f=(1-Math.sqrt(d2)/R),acc=950*S*f/(p.m*heavy);
        p.px+=ex/n*acc*dt;p.py+=ey/n*acc*dt;}
      if(s.t>3.2){s.st='rest';s.t=0;}
    }else if(s.st==='rest'){if(s.t>1.7){s.st='idle';s.t=0;s.tgt=null;}}
  }
}

function update(dt){
  if(state==='shop'||state==='intro')return;
  clock+=dt;
  if(bannerT>0){bannerT-=dt;if(bannerT<=0&&fireT<=0)$('banner').hidden=true;}
  if(state==='play'){
    nightT+=dt;
    let rate=Math.min(28,2.6+(night-1)*1.3+nightT*TS*(.05+.02*night));
    for(const f of fires){if(!f.done&&nightT>=f.at){f.done=true;fireT=f.dur;
      SFX.fire();banner(T('fire'),f.spots+' '+T('spots'),'fire',f.dur);}}
    if(fireT>0){fireT-=dt;rate*=1.8;if(fireT<=0){fireT=0;banner(T('wind'),T('easing'),'info',2);}}
    spawnAcc+=rate*dt;
    while(spawnAcc>=1){spawnAcc--;const fire=fireT>0;addPart(fire&&Math.random()<.7?0:null,fire&&Math.random()<.6?'thick':'haze');}
    waveT-=dt;if(waveT<=0){const side=Math.random()*3|0,n=12+night*4+Math.min(14,nightT*TS/6|0);for(let i=0;i<n;i++)addPart(side);
      waveT=Math.max(3.5,(Math.max(7,17-night*1.5)+Math.random()*4)/TS);}
    if(!efanOn&&clock-lastSwipe>.35){stam=Math.min(stamMax(),stam+regen()*dt);if(tired&&stam>=stamMax()*.35)tired=false;}
    if(up.efan){if(efanOn){batt-=battIdle()*dt;if(batt<=0){batt=0;setEfan(false);SFX.flat();float(W/2,H*.55,T('dead'),'#5fb8ff',15);}}
      else{batt=Math.min(100,batt+battCharge()*dt);if(batt>=100){setEfan(true);SFX.ready();}}}
    staffUpdate(dt);catUpdate(dt);if(signCd>0)signCd=Math.max(0,signCd-dt);
    if(nightT>=NIGHT){endNight();}
  }
  const k=Math.exp(-1.7*dt),M=140*S,purs=state==='play'?purifs.map((o,i)=>o&&filt[i]>0?purPos(i):null).filter(Boolean):[],PR=125*S;
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];
    p.f=Math.min(1,p.f+dt*.7);p.ph+=dt;p.age+=dt;
    if(p.kind==='smoke'){p.r=Math.min(34*S,p.r+dt*4*S);}
    p.x+=(p.vx+p.px+Math.sin(p.ph*.7)*6*S)*dt;p.y+=(p.vy+p.py+Math.cos(p.ph*.5)*4*S)*dt;p.px*=k;p.py*=k;
    for(const q of purs){const d=Math.hypot(p.x-q.x,p.y-(q.y-10*S));if(d<PR){const f=1-d/PR;p.a-=.32*dt*f;p.px+=(q.x-p.x)/(d||1)*60*S*f*dt;p.py+=(q.y-10*S-p.y)/(d||1)*60*S*f*dt;}}
    p.w=Math.max(0,p.a)*p.f*Math.min(1,(p.life-p.age)/2);
    if(p.a<.03||p.age>p.life||p.x<-M||p.x>W+M||p.y<-M||p.y>H+M){parts[i]=parts[parts.length-1];parts.pop();}}
  const R=68*S,R2=R*R;tables.forEach(t=>t.dens=0);
  for(const p of parts){for(const t of tables){const dx=p.x-t.x,dy=p.y-(t.y-14*S),d2=dx*dx+dy*dy;if(d2<R2)t.dens+=p.w*(p.kind==='smoke'?1.4:1)*(1-Math.sqrt(d2)/R);}}
  let sum=0;
  for(const t of tables){sum+=t.dens;
    if(!t.cust){if(state==='play'){t.respawn-=dt;if(t.respawn<=0)t.cust=newCust();}continue;}
    const c=t.cust;c.t+=dt;custPos(c,t);
    if(c.state==='arrive'){if(c.t>1.1){c.state='sit';c.t=0;}}
    else if(c.state==='sit'&&state==='play'){
      if(c.mask>0)c.mask-=dt;
      const thr=c.mask>0?TH*1.9:TH;
      if(c.smoker&&c.mask>0&&c.cig>0){c.cig=0;c.cigCd=rnd(6,9);}
      if(c.smoker&&!(c.mask>0)){
        if(c.cig>0){c.cig-=dt;c.smokeAcc+=dt;while(c.smokeAcc>.26){c.smokeAcc-=.26;addSmoke(c.px+10*S,c.hy+4*S);}if(c.cig<=0)c.cigCd=rnd(9,15);}
        else{c.cigCd-=dt;if(c.cigCd<=0){c.cig=rnd(12,16);SFX.lighter();if(!seenSmoker){seenSmoker=true;state='intro';pointers.clear();$('smokeOv').hidden=false;}
          else if(up.sign&&!signHint){signHint=true;banner(T('signHintT'),T('signHintS'),'info',3);}}}
      }
      if(t.dens>thr){c.pat-=(.07+(t.dens-thr)*.2)*dt*(c.smoker?.5:1)*(c.mask>0?.5:1)*(up.tv?.6:1);c.coughT-=dt;
        if(c.coughT<=0&&!c.smoker){c.coughT=rnd(1.1,2.5);float(t.x+(Math.random()-.5)*40*S,t.y-64*S,pick(T('cough')),'#c9c3b0',11);if(clock-lastCough>.3){lastCough=clock;SFX.cough();}}}
      else{if(t.dens<thr*.7)c.pat=Math.min(1,c.pat+.05*dt);c.ord-=dt*(t.dens<thr*.45?1.3:1);if(c.ord<=0)serve(t);}
      if(cat&&cat.st==='sit'&&cat.tgt===t)c.pat=Math.min(1,c.pat+.14*dt);
      if(c.pat<=0&&TM.god)c.pat=.05;
      if(c.pat<=0){c.state='leave';c.t=0;walk++;SFX.walkout();float(t.x,t.y-66*S,c.smoker?T('smokerQuit'):T('quitF'),'#ff7a6b',15);hud();if(walk>=MAXW)gameOver();}
    }

  }
  const target=18+(sum/4)*95+parts.length*.12;
  api+=(target-api)*Math.min(1,dt*1.5);if(state==='play')peak=Math.max(peak,api);
  for(let i=floats.length-1;i>=0;i--){floats[i].t+=dt;if(floats[i].t>floats[i].life)floats.splice(i,1);}
  for(let i=trails.length-1;i>=0;i--){trails[i].t+=dt;if(trails[i].t>.35)trails.splice(i,1);}
}

function drawKipas(x,y,rot,scale,tiredLook){

  for(let i=0;i<12;i++){const a=i/12*Math.PI*2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*24*s,Math.sin(a)*24*s);ctx.stroke();}

function drawFan(p){

  ctx.fillStyle='#f2efe7';rr(ctx,x-11*k,y+4*k-bob,22*k,28*k,4*k);ctx.fill();

}

  const ents=tables.map(t=>({y:t.y,f:()=>drawTable(t)})).concat(staff.map(s=>({y:s.y+12*S,f:()=>drawStaff(s)})));
  purifs.forEach((o,i)=>{if(o)ents.push({y:purPos(i).y,f:()=>drawPurifier(i)});});
  if(cat)ents.push({y:cat.y,f:drawCat});
  if(up.tv)drawTV();
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.f());

  ctx.globalAlpha=1;

  ctx.lineCap='round';
  for(const tr of trails){const q=1-tr.t/.35,len=(18+40*tr.s)*S;ctx.strokeStyle=tr.e?`rgba(150,210,255,${q*.6})`:`rgba(240,250,240,${q*.45})`;ctx.lineWidth=2*S;
    for(const o of [-9,0,9]){const ox=-tr.uy*o*S,oy=tr.ux*o*S;ctx.beginPath();ctx.moveTo(tr.x+ox,tr.y+oy);ctx.lineTo(tr.x+ox-tr.ux*len*(o?0.6:1),tr.y+oy-tr.uy*len*(o?0.6:1));ctx.stroke();}}
  if(state==='play')pointers.forEach(drawFan);
  if(armed&&state==='play'){const col=armed==='mask'?'191,227,242':'255,138,124';for(const t of tables){const c=t.cust;if(c&&c.state==='sit'&&(armed==='mask'?!(c.mask>0)&&!(c.smoker&&c.cig>0):c.smoker&&c.cig>0)){ctx.strokeStyle=`rgba(${col},${.45+.4*Math.sin(clock*8)})`;ctx.lineWidth=2.5*S;ctx.beginPath();ctx.arc(c.px,c.hy,25*S,0,7);ctx.stroke();}}}
  if(drag&&drag.moved>10&&state==='play'&&drag.tool==='sign'){const my=drag.y-34*S,tc=toolTarget('sign',drag.x,my),r=14*S;
    if(tc){ctx.strokeStyle='rgba(255,138,124,.95)';ctx.lineWidth=3*S;ctx.setLineDash([5*S,4*S]);ctx.beginPath();ctx.arc(tc.px,tc.hy,27*S,0,7);ctx.stroke();ctx.setLineDash([]);}
    ctx.fillStyle='#f4f1ea';ctx.beginPath();ctx.arc(drag.x,my,r,0,7);ctx.fill();ctx.fillStyle='#555';ctx.fillRect(drag.x-8*S,my-1.6*S,12*S,3.2*S);ctx.fillStyle='#f08a3c';ctx.fillRect(drag.x+4*S,my-1.6*S,3*S,3.2*S);
    ctx.strokeStyle='#d63a2c';ctx.lineWidth=3.2*S;ctx.beginPath();ctx.arc(drag.x,my,r,0,7);ctx.moveTo(drag.x-r*.7,my-r*.7);ctx.lineTo(drag.x+r*.7,my+r*.7);ctx.stroke();}
  if(drag&&drag.moved>10&&state==='play'&&drag.tool==='mask'){const my=drag.y-34*S,tc=toolTarget('mask',drag.x,my);
    if(tc){ctx.strokeStyle='rgba(191,227,242,.95)';ctx.lineWidth=3*S;ctx.setLineDash([5*S,4*S]);ctx.beginPath();ctx.arc(tc.px,tc.hy,27*S,0,7);ctx.stroke();ctx.setLineDash([]);}
    const k=S*1.4;ctx.strokeStyle='#d8eef7';ctx.lineWidth=1.5*k;ctx.beginPath();ctx.moveTo(drag.x-10*k,my-3*k);ctx.quadraticCurveTo(drag.x-15*k,my,drag.x-10*k,my+3*k);ctx.moveTo(drag.x+10*k,my-3*k);ctx.quadraticCurveTo(drag.x+15*k,my,drag.x+10*k,my+3*k);ctx.stroke();
    ctx.fillStyle='#bfe3f2';rr(ctx,drag.x-10*k,my-6*k,20*k,12*k,4*k);ctx.fill();ctx.strokeStyle='#8fb9cc';ctx.lineWidth=1*k;ctx.beginPath();ctx.moveTo(drag.x-7*k,my-2*k);ctx.lineTo(drag.x+7*k,my-2*k);ctx.moveTo(drag.x-7*k,my+2*k);ctx.lineTo(drag.x+7*k,my+2*k);ctx.stroke();}
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const f of floats){const q=f.t/f.life;ctx.globalAlpha=1-q*q;ctx.font=`${Math.round(f.size*S)}px Bungee, Impact, sans-serif`;
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillText(f.txt,f.x+1.5,f.y-q*34*S+1.5);ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y-q*34*S);}
  ctx.globalAlpha=1;
}

function startNight(){

  state='play';drag=null;armed=null;signCd=0;nightT=0;spawnAcc=0;waveT=14/TS;floats=[];soldNight=0;tonight=0;walk=0;api=20;
  parts=parts.slice(0,20);stam=stamMax();tired=false;batt=100;setEfan(!!up.efan);fireT=0;
  tables.forEach((t,i)=>{t.cust=null;t.respawn=.4+i*.8;});
  fires=[];

  for(let i=0;i<nf;i++)fires.push({at:rnd(3,NIGHT-5),dur:rnd(4,6.5),spots:Math.round(rnd(120,300)+night*40),done:false});

function endNight(){
  state='shop';pointers.clear();
  const stay=Math.min(up.staff,Math.floor(tonight/WAGE)),quit=up.staff-stay,wages=stay*WAGE;wallet=Math.max(0,wallet-wages);
  sum={n:night,walk,sold:soldNight,quit:quit>0?STAFF_NAMES.slice(stay,up.staff):[]};if(quit>0)up.staff=stay;
  $('shSold').textContent=soldNight;$('shRm').textContent='RM'+Math.round(tonight);
  $('shWalk').textContent=walk+' / '+MAXW;
  const wg=$('shWage');wg.textContent=wages?'−RM'+wages:'RM0';wg.classList.toggle('neg',wages>0);
  if(night>=7)purifs.forEach((o,i)=>{if(o)filt[i]=Math.max(0,filt[i]-1);});
  night++;
  if(!TM.on&&night-1>best){best=night-1;try{localStorage.setItem('ttj-best-nights',String(best))}catch(e){}}
  shopText();renderShop();scrollToNew();$('banner').hidden=true;$('shopOv').hidden=false;
}
function purifRow(it,box){const row=document.createElement('div');row.className='item';const n=purifs.filter(Boolean).length,p=[60,90,130,180][Math.min(3,n)];
  row.innerHTML=itemHead(it);
  const pl=document.createElement('div');pl.className='place';pl.textContent=T('table');
  tables.forEach((t,i)=>{const pb=document.createElement('button');
    if(purifs[i]){pb.textContent=(i+1)+' ✓';pb.setAttribute('aria-pressed','true');pb.disabled=true;}
    else{pb.textContent=String(i+1);pb.disabled=wallet<p;pb.addEventListener('click',()=>{if(wallet<p)return;wallet-=p;purifs[i]=true;filt[i]=2;SFX.buy();renderShop();hud();});}
    pl.appendChild(pb);});
  if(n<4){const pr=document.createElement('span');pr.className='price';pr.textContent=T('nextP')(p);pl.appendChild(pr);}
  row.appendChild(pl);box.appendChild(row);}
function filterRow(it,box){const row=document.createElement('div');row.className='item';const p=it.prices[0];
  row.innerHTML=itemHead(it);
  const wrap=document.createElement('div');wrap.className='filts';
  if(!purifs.some(Boolean)){const e=document.createElement('div');e.className='filt';e.innerHTML=`<span class="st">${T('noPur')}</span>`;wrap.appendChild(e);}
  purifs.forEach((o,i)=>{if(!o)return;const l=filt[i],r=document.createElement('div');r.className='filt'+(l?'':' dirty');
    r.innerHTML=`<span class="tno">${T('table')} ${i+1}</span><span class="life"><i class="${l>=1?'on':''}"></i><i class="${l>=2?'on':''}"></i></span><span class="st">${l>=2?T('fl'):l?T('left1'):T('dirty')}</span>`;
    const b=document.createElement('button');b.className='buy';
    if(l>=2){b.textContent=T('full');b.disabled=true;}
    else{b.textContent='RM'+p;b.disabled=wallet<p;b.addEventListener('click',()=>{if(wallet<p)return;wallet-=p;filt[i]=2;SFX.buy();renderShop();hud();});}
    r.appendChild(b);wrap.appendChild(r);});
  row.appendChild(wrap);box.appendChild(row);}
function scrollToNew(){requestAnimationFrame(()=>{const box=$('shop'),tag=box.querySelector('.new');
  if(!tag){box.scrollTop=0;return;}const it=tag.closest('.item');it.classList.add('fresh');
  const top=it.offsetTop-8;try{box.scrollTo({top,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}catch(e){box.scrollTop=top;}});}
function renderShop(){
  $('shWallet').textContent='RM'+Math.round(wallet);
  const box=$('shop');box.innerHTML='';
  for(const it of SHOP){
    if(it.req&&!up[it.req])continue;
    if(night-1<(it.from||0))continue;
    if(it.id==='purif'){purifRow(it,box);continue;}
    if(it.id==='filter'){filterRow(it,box);continue;}
    const lvl=it.repeat?0:up[it.id],max=it.repeat?Infinity:it.prices.length,price=it.prices[lvl];
    const row=document.createElement('div');row.className='item';
    const pips=(max>1&&!it.repeat)?`<span class="pips">${Array.from({length:max},(_,i)=>`<i class="${i<lvl?'on':''}"></i>`).join('')}</span>`:'';
    row.innerHTML=itemHead(it,pips);
    const b=document.createElement('button');b.className='buy';b.id='buy-'+it.id;
    if(lvl>=max){b.textContent=max>1?T('max'):T('owned');b.disabled=true;}
    else{b.textContent='RM'+price;b.disabled=wallet<price;
      b.addEventListener('click',()=>{if(wallet<price)return;wallet-=price;SFX.buy();if(it.repeat){masks+=it.qty;everMask=true;}else up[it.id]++;renderShop();hud();});}
    row.appendChild(b);
    box.appendChild(row);
  }
}
function gameOver(){
  state='over';pointers.clear();
  $('sNights').textContent=night-1;$('sSold').textContent=soldTotal;$('sRm').textContent='RM'+Math.round(earnedTotal);$('sApi').textContent=Math.round(peak);
  $('overT').textContent=overTitle();
  $('best2').textContent=bestLine();
  setTimeout(()=>{$('banner').hidden=true;$('over').hidden=false;},800);
}
// --- secret test mode: tap the title 5 times, or open the link with #test
const TM={on:false,god:false,speed:1,unlock:false};
function tmSet(on){TM.on=on;$('tm').hidden=!on;if(!on){TM.god=false;TM.speed=1;TM.unlock=false;}tmSync();try{sessionStorage.setItem('ttj-test',on?'1':'0')}catch(e){}}
function tmSync(){$('tmGod').setAttribute('aria-pressed',String(TM.god));$('tmUnlock').setAttribute('aria-pressed',String(TM.unlock));
  document.querySelectorAll('[data-sp]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.sp===TM.speed)));
  $('tmNight').value=night;}
let tmTaps=[];$('title').addEventListener('click',()=>{const n=performance.now();tmTaps=tmTaps.filter(t=>n-t<2000);tmTaps.push(n);if(tmTaps.length>=5){tmTaps=[];tmSet(!TM.on);SFX.tick();}});
$('tmTab').addEventListener('click',()=>{const b=$('tmBody');b.hidden=!b.hidden;$('tmTab').setAttribute('aria-expanded',String(!b.hidden));});
function tmEnsureRun(){if(state==='menu'||state==='over'){newGame();if(TM.unlock)tmUnlockApply();}}
function tmUnlockApply(){const sg=SHOP.find(i=>i.id==='sign');if(TM.unlock){SHOP.forEach(i=>{if(i._from==null)i._from=i.from;i.from=0;});}else{SHOP.forEach(i=>{if(i._from!=null){i.from=i._from;delete i._from;}});if(smokerNight)sg.from=smokerNight;}}
$('tmGo').addEventListener('click',()=>{const n=Math.max(1,Math.min(30,parseInt($('tmNight').value)||1));
  tmEnsureRun();
  night=n;if(n>7&&!smokerNight){smokerNight=7;SHOP.find(i=>i.id==='sign').from=TM.unlock?0:7;}
  state='shop';pointers.clear();drag=null;armed=null;sum={n:n-1,walk:0,sold:0,quit:[]};
  ['shSold','shWalk'].forEach(id=>$(id).textContent='0');$('shRm').textContent='RM0';$('shWage').textContent='RM0';$('shWage').classList.remove('neg');
  ['start','over','smokeOv'].forEach(id=>$(id).hidden=true);$('banner').hidden=true;shopText();renderShop();$('shopOv').hidden=false;scrollToNew();hud();tmSync();});
document.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{tmEnsureRun();wallet+=+b.dataset.rm;hud();if(state==='shop')renderShop();}));
$('tmMasks').addEventListener('click',()=>{tmEnsureRun();masks+=10;everMask=true;hud();if(state==='shop')renderShop();});
$('tmEnd').addEventListener('click',()=>{if(state==='intro'){$('smokeOv').hidden=true;state='play';}if(state==='play'){endNight();tmSync();}});
$('tmFire').addEventListener('click',()=>{if(state==='play')fires.push({at:nightT,dur:rnd(4,6.5),spots:Math.round(rnd(120,300)+night*40),done:false});});
$('tmSmoke').addEventListener('click',()=>{if(state!=='play')return;const t=tables.find(t=>t.cust&&t.cust.state==='sit'&&!t.cust.smoker)||tables.find(t=>t.cust&&t.cust.state==='sit');
  if(t){const c=t.cust;c.smoker=true;c.mask=0;c.cig=0;c.cigCd=.1;}});
document.querySelectorAll('[data-sp]').forEach(b=>b.addEventListener('click',()=>{TM.speed=+b.dataset.sp;tmSync();}));
$('tmGod').addEventListener('click',()=>{TM.god=!TM.god;tmSync();});
$('tmUnlock').addEventListener('click',()=>{TM.unlock=!TM.unlock;tmUnlockApply();tmSync();if(state==='shop')renderShop();});
$('tmOff').addEventListener('click',()=>{TM.unlock=false;tmUnlockApply();tmSet(false);if(state==='shop')renderShop();});
try{if(location.hash==='#test'||sessionStorage.getItem('ttj-test')==='1')tmSet(true);}catch(e){if(location.hash==='#test')tmSet(true);}

$('go').addEventListener('click',newGame);$('again').addEventListener('click',newGame);$('next').addEventListener('click',startNight);

// --- input
function tapAt(x,y){
  if(armed){const c=toolTarget(armed,x,y);if(c)applyTool(armed,c);armed=null;updTray();return true;}
  return false;
}
cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,t:performance.now(),st:performance.now(),moved:0,ang:-Math.PI/2,active:false});});
cv.addEventListener('pointermove',e=>{
  let p=pointers.get(e.pointerId);
  if(!p){if(e.pointerType!=='mouse')return;p={x:e.clientX,y:e.clientY,t:performance.now(),st:0,moved:99,ang:-Math.PI/2,active:false,hover:true};pointers.set(e.pointerId,p);}
  const now=performance.now(),dt=Math.max(8,now-p.t)/1000,dx=e.clientX-p.x,dy=e.clientY-p.y,d=Math.hypot(dx,dy);
  if(d>1.5){const sp=d/dt;p.ang=Math.atan2(dy,dx);
    if(!p.hover||e.buttons){p.moved+=d;
      if(state==='play'){
        let power=0;
        if(efanOn){batt=Math.max(0,batt-d/S*battSwipe());power=1.8;}
        else if(!tired){stam-=d/S*.075;power=1;lastSwipe=clock;
          if(stam<=0){stam=0;tired=true;SFX.tired();}}
        else lastSwipe=Math.min(lastSwipe,clock);
        if(power){gust(p.x,p.y,e.clientX,e.clientY,sp,power);if(sp>500&&clock-lastWhoosh>.13){lastWhoosh=clock;SFX.whoosh(Math.min(1,sp/2000),efanOn);}if(sp>250)trails.push({x:e.clientX,y:e.clientY,ux:dx/d,uy:dy/d,s:Math.min(1,sp/1600),t:0,e:efanOn});}
      }
      p.active=true;}}
  p.x=e.clientX;p.y=e.clientY;p.t=now;
});
const upH=e=>{const p=pointers.get(e.pointerId);if(!p)return;
  if(e.type==='pointerup'&&state==='play'&&p.moved<12&&performance.now()-p.st<400)tapAt(e.clientX,e.clientY);
  if(e.pointerType==='mouse'&&e.type==='pointerup'){p.hover=true;p.active=false;p.moved=99;}else pointers.delete(e.pointerId);};
cv.addEventListener('pointerup',upH);cv.addEventListener('pointercancel',upH);
cv.addEventListener('pointerleave',e=>pointers.delete(e.pointerId));
cv.addEventListener('contextmenu',e=>e.preventDefault());

function toolTarget(tool,x,y){let bc=null,bd=80*S;for(const t of tables){const c=t.cust;if(!c||c.state!=='sit')continue;
  if(tool==='mask'?(c.mask>0||(c.smoker&&c.cig>0)):!(c.smoker&&c.cig>0))continue;const d=Math.hypot(x-c.px,y-c.hy);if(d<bd){bd=d;bc=c;}}return bc;}
function applyTool(tool,c){
  if(tool==='mask'){c.mask=12;masks--;SFX.mask();float(c.px,c.hy-30*S,T('masked'),'#bfe3f2',13);}
  else{c.cig=0;c.cigCd=rnd(14,20);signCd=SIGNCD;SFX.stamp();float(c.px,c.hy-30*S,T('out'),'#ff8a7c',13);}
  updTray();}
function toolReady(tool){return tool==='mask'?masks>0:!!up.sign&&signCd<=0;}
function updTray(){const tr=$('tray');tr.hidden=masks<=0&&!everMask;$('maskN').textContent='×'+masks;tr.disabled=masks<=0;
  const st=$('signTray');st.hidden=!up.sign;st.disabled=signCd>0;const sn=signCd>0?Math.ceil(signCd)+'s':T('drag');
  st.classList.toggle('nudge',signCd<=0&&armed!=='sign'&&!drag&&tables.some(t=>t.cust&&t.cust.state==='sit'&&t.cust.smoker&&t.cust.cig>0));if($('signN').textContent!==sn)$('signN').textContent=sn;
  if(armed&&!toolReady(armed))armed=null;tr.classList.toggle('armed',armed==='mask');st.classList.toggle('armed',armed==='sign');}
function setupTray(el,tool){
  el.addEventListener('pointerdown',e=>{if(state!=='play'||!toolReady(tool))return;e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}
    drag={tool,id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,moved:0};});
  el.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;drag.x=e.clientX;drag.y=e.clientY;drag.moved=Math.max(drag.moved,Math.hypot(drag.x-drag.sx,drag.y-drag.sy));});
  const end=e=>{if(!drag||drag.id!==e.pointerId)return;const d=drag;drag=null;if(e.type!=='pointerup'||state!=='play')return;
    if(d.moved<10){armed=armed===tool?null:tool;updTray();return;}
    const c=toolTarget(tool,e.clientX,e.clientY-34*S);if(c)applyTool(tool,c);};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);}
setupTray($('tray'),'mask');setupTray($('signTray'),'sign');

addEventListener('resize',resize);
resize();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawBG);
for(let i=0;i<40;i++){addPart();const p=parts[parts.length-1];if(p){p.x=Math.random()*W;p.y=topH+Math.random()*(H-topH);p.f=1;}}
tables.forEach(t=>{t.cust=newCust();t.cust.state='sit';t.cust.pat=.6+Math.random()*.4;});
hud();applyLang();

let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000)*(drag&&drag.moved>10&&state==='play'?.35:1);last=now;
  if(state==='menu'&&parts.length<40)addPart();
  for(let k=0;k<TM.speed;k++)update(dt);render();hudFrame();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
